# NodePool — "어떤 노드를 **얼마까지** 만들어도 되는가" (Stage 5b)
# 관리형 노드그룹의 instance_types · scaling_config 에 해당한다.
#
# Karpenter 는 Pending 파드의 요구량을 보고, 아래 조건을 만족하는 인스턴스 중 **가장 싼 것**을 고른다.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        # 앱 이미지가 arm64 전용이다(ECR 에 arm64 만 올린다).
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        # 스팟은 쓰지 않는다 — 중단 알림 큐가 따라오는 별개 주제다.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        # 고를 수 있는 종류를 묶는다. 안 묶으면 수백 종 중에서 고른다.
        # 🔴 **계정이 실제로 띄울 수 있는 종류만 적는다** (2026-10-12 실측).
        #   처음엔 t4g.medium 도 넣었다. Pending 이 3개 동시에 생기자 Karpenter 가 medium 한 대를 골랐고
        #   AWS 가 거절했다:  InvalidParameterCombination: The specified instance type is not eligible for Free Tier
        #   Karpenter 는 small 2대로 **바꿔 시도하지 않는다.** NodeClaim 이 Launched=Unknown 으로 멈추고
        #   파드는 계속 Pending 이다. 이 계정(무료 플랜)이 띄울 수 있는 arm64 는 t4g.micro · t4g.small 뿐이다:
        #     aws ec2 describe-instance-types --filters Name=free-tier-eligible,Values=true \
        #       --query 'InstanceTypes[].InstanceType'
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t4g.small"]
        # postgres 볼륨이 있는 AZ. 다른 AZ 에 뜨면 AZ 간 전송 요금이 붙는다.
        # 값은 `tofu output -raw persistent_az` 와 같아야 한다.
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-northeast-2a"]

  # 🔴 **비용 상한이다.** 이 NodePool 이 만든 노드의 vCPU 합이 4 를 넘지 못한다
  #    = t4g.small(2 vCPU) 2대.
  limits:
    cpu: "4"

  disruption:
    # 비었거나, 파드를 다른 노드로 옮기면 더 싸지는 노드를 지운다.
    consolidationPolicy: WhenEmptyOrUnderutilized
    # 조건이 성립한 뒤 기다리는 시간. 실습은 기다리는 시간이 과금이라 짧게 잡았다.
    consolidateAfter: 30s
