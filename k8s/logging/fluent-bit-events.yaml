# Stage 5d — K8s 이벤트 수집기 (클러스터에 1개, Deployment)
#
# 차트: fluent/fluent-bit 0.58.3 (앱 5.1.3) — 컨테이너 로그 수집기와 **같은 차트를 한 번 더** 설치한다.
#
# 왜 따로 두나 (계획서 D7):
#   이벤트(Scheduled · Pulled · BackOff · Killing …)는 파일이 아니라 API 서버 안에 약 1시간 머문다.
#   그래서 파일을 읽는 DaemonSet 으로는 못 거둔다. API 를 watch 하는 kubernetes_events 입력이 필요한데,
#   이벤트는 클러스터에 **한 벌**이라 노드마다 뜨는 DaemonSet 에 넣으면 노드 수만큼 중복 수집된다.
#   → Deployment 1개.
#
# 설치:
#   helm install fluent-bit-events fluent/fluent-bit --version 0.58.3 -n logging \
#     -f k8s/logging/fluent-bit-events.yaml \
#     --set-string serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=$(tofu -chdir=infra/aws-eks/2-cluster output -raw fluent_bit_role_arn)

kind: Deployment
replicaCount: 1
fullnameOverride: fluent-bit-events

image:
  tag: 5.1.3

testFramework:
  enabled: false

serviceAccount:
  create: true
  # 🔴 infra/aws-eks/2-cluster/irsa-fluent-bit.tf 의 locals 와 글자 단위로 같아야 한다.
  name: fluent-bit-events

rbac:
  create: true
  eventsAccess: true # ClusterRole 에 events list/watch 를 더한다

resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { memory: 128Mi }

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush {{ .Values.flush }}
        Log_Level {{ .Values.logLevel }}
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port {{ .Values.metricsPort }}
        Health_Check On

  # kube_retention_time — 기동 시 이미 있던 이벤트 중 이 시간 안의 것만 가져온다.
  # 재시작마다 1시간치를 다시 올리면 중복이 생기므로 짧게 둔다.
  inputs: |
    [INPUT]
        Name kubernetes_events
        Tag k8s_events
        kube_url https://kubernetes.default.svc
        kube_retention_time 5m

  # 파일 로그용 필터(kubernetes)는 필요 없다 — 이벤트 레코드에 involvedObject(네임스페이스·이름)가 이미 들어 있다.
  filters: ""

  outputs: |
    [OUTPUT]
        Name cloudwatch_logs
        Match k8s_events
        region ap-northeast-2
        log_group_name /devquest/eks-learning/events
        log_stream_name k8s-events
        auto_create_group Off
