# ExternalSecret — core-api-db (in-cluster Postgres 모드) · EKS Stage 3a
#
# ── Stage 2 버전(externalsecret-db.yaml)과 무엇이 다른가 ──
#
# 두 파일은 **똑같은 이름의 K8s Secret(`core-api-db`)을 만든다.** 배타적으로 하나만 apply한다.
# 차이는 "값을 어디서 긁어오는가" 하나뿐이고, 그 차이가 이번 Stage의 핵심 대비다.
#
#   | | Stage 2 (RDS) | Stage 3a (in-cluster) |
#   |---|---|---|
#   | remoteRef 출처 | **2군데** — RDS 관리형 시크릿 + tofu 시크릿 | **1군데** — tofu 시크릿 |
#   | 시크릿 이름 | AWS가 정함 (`rds!db-<uuid>`) | 우리가 정함 (`devquest-eks/db-connection`) |
#   | apply 절차 | ARN을 sed로 치환해야 함 | **그냥 apply** — 치환 없음 |
#
# 🔑 즉 "관리형이 편한 대신 이름을 못 정한다"는 트레이드오프를 양쪽에서 겪는다.
#    Stage 2에서 PLACEHOLDER sed가 귀찮았던 이유가 여기서 사라지는 것으로 증명된다.
#    반대로 잃은 것도 있다 — RDS는 비밀번호를 **자동 로테이션**했지만 우리 건 안 한다.
#
# 적용:
#   kubectl apply -f k8s/eso/secretstore.yaml
#   kubectl apply -f k8s/eso/externalsecret-db-incluster.yaml
#   kubectl apply -f k8s/eso/externalsecret-app.yaml
#   ⚠️ externalsecret-db.yaml(Stage 2용)과 **동시에 적용하지 말 것** — 같은 Secret을
#      두 소유자가 다투게 되어 값이 왔다갔다 한다.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: core-api-db
  namespace: default
spec:
  # in-cluster 비밀번호는 로테이션되지 않으므로(세션마다 재생성) 짧게 잡을 이유가 없다.
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore

  target:
    name: core-api-db
    creationPolicy: Owner

  # ── 4개 키가 전부 한 시크릿에서 나온다 ──
  # tofu의 aws_secretsmanager_secret_version.db_connection_incluster가 만든 JSON:
  #   { "host": "postgres", "dbname": "...", "username": "...", "password": "..." }
  #
  # ⚠️ 이 Secret은 **core-api와 postgres 양쪽이 함께 쓴다.**
  #    core-api : envFrom으로 DB_* 4개를 통째로 먹는다
  #    postgres : secretKeyRef로 POSTGRES_USER/PASSWORD/DB에 매핑한다
  #    같은 원천을 보므로 "앱과 DB의 비밀번호가 어긋나는" 사고가 구조적으로 불가능하다.
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: devquest-eks/db-connection
        property: host
    - secretKey: DB_NAME
      remoteRef:
        key: devquest-eks/db-connection
        property: dbname
    - secretKey: DB_USERNAME
      remoteRef:
        key: devquest-eks/db-connection
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: devquest-eks/db-connection
        property: password
