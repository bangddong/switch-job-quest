# ExternalSecret — postgres-tls (in-cluster Postgres 서버 인증서) · EKS Stage 3a
#
# 왜 필요한가: `application-prod.yml`의 jdbc-url이 `?sslmode=require`로 하드코딩돼 있다.
# RDS는 TLS가 켜진 채로 오지만 맨 postgres 이미지는 아니라서, 갈아끼우자마자
#   PSQLException: The server does not support SSL.
# 로 앱이 죽는다. → 자체운영에서는 TLS도 내가 소유한다.
#
# 인증서는 tofu가 만든다(`infra/aws-eks/2-cluster/postgres-tls.tf`).
# 손으로 `kubectl create secret`을 하지 않는 Stage 2 규칙을 그대로 지키고,
# 이미 세워 둔 Secrets Manager → ESO 파이프를 재사용한다(새 개념 0).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-tls
  namespace: default
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore

  target:
    name: postgres-tls
    creationPolicy: Owner

  # 키 이름이 그대로 파일명이 된다 — StatefulSet이 이 Secret을 볼륨으로 마운트하면
  # /certs/server.crt, /certs/server.key 로 나타난다.
  data:
    - secretKey: server.crt
      remoteRef:
        key: devquest-eks/postgres-tls
        property: server.crt
    - secretKey: server.key
      remoteRef:
        key: devquest-eks/postgres-tls
        property: server.key
