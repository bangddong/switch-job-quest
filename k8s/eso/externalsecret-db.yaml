# ExternalSecret — core-api-db (DB 접속 4개 키) · EKS Stage 2
#
# ── 이 파일이 하는 일 ──
# "AWS Secrets Manager의 값들을 모아 `core-api-db`라는 K8s Secret을 만들어 두고, 계속 동기화해라."
# 앱은 이 Secret을 envFrom으로 그대로 먹는다 → **앱 코드·이미지 변경 0.**
#
# ── 왜 remoteRef가 두 군데를 가리키나 (Stage 2에서 가장 헷갈리는 지점) ──
# DB 접속에 필요한 값 4개가 **서로 다른 시크릿에 나뉘어 있다**:
#   ① username / password → RDS가 `manage_master_user_password = true`로 **직접 만든** 시크릿.
#      소유자가 AWS라서 우리가 이름을 못 정한다 (`rds!db-<uuid>` 형태로 자동 생성).
#   ② host / dbname       → tofu가 만든 시크릿(`devquest-eks/db-connection`).
#      ①에는 접속 좌표가 안 들어있기 때문에 따로 필요하다.
# ExternalSecret은 data[] 항목마다 다른 remoteRef를 가질 수 있어 이 합성이 가능하다.
#
# ⚠️ RDS_MASTER_SECRET_PLACEHOLDER는 apply 시점에 치환한다.
#    이름을 AWS가 정하므로 코드에 박을 수 없다. 절차:
#      cd infra/aws-eks/2-cluster
#      ARN=$(tofu output -raw db_master_secret_arn)
#      sed "s|RDS_MASTER_SECRET_PLACEHOLDER|$ARN|" k8s/eso/externalsecret-db.yaml | kubectl apply -f -
#    (k8s/base/core-api.yaml의 IMAGE_PLACEHOLDER와 같은 관례)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: core-api-db
  namespace: default
spec:
  # 얼마나 자주 AWS를 다시 읽을지. RDS 마스터 비밀번호가 로테이션되면 이 주기 안에 반영된다.
  # 짧게 잡으면 Secrets Manager API 호출 요금($0.05/10,000회)이 늘지만, 1h면 세션당 수 회 수준.
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore

  target:
    # 만들어질 K8s Secret 이름. k8s/base/core-api.yaml의 envFrom.secretRef와 반드시 일치.
    name: core-api-db
    # Owner: 이 ExternalSecret이 Secret의 소유자가 되어, 지워지면 Secret도 함께 사라진다.
    # (teardown 시 "Secret만 지워도 ESO가 즉시 재생성"되는 혼란을 피하려면 ExternalSecret을 먼저 지울 것)
    creationPolicy: Owner

  data:
    # ── ① RDS가 만든 시크릿에서 (AWS 소유) ──
    - secretKey: DB_USERNAME
      remoteRef:
        key: RDS_MASTER_SECRET_PLACEHOLDER
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: RDS_MASTER_SECRET_PLACEHOLDER
        property: password

    # ── ② tofu가 만든 접속 좌표에서 ──
    # host에는 포트가 없다. application-prod.yml의 jdbc-url이
    #   jdbc:postgresql://${DB_HOST}/${DB_NAME}
    # 형태라 포트를 포함하지 않기 때문 — RDS `.endpoint`(host:5432)를 넣으면 URL이 깨진다.
    - secretKey: DB_HOST
      remoteRef:
        key: devquest-eks/db-connection
        property: host
    - secretKey: DB_NAME
      remoteRef:
        key: devquest-eks/db-connection
        property: dbname
