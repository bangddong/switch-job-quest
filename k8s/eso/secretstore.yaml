# SecretStore — "이 네임스페이스가 어떤 외부 시크릿 저장소를 쓰는가"의 선언 (EKS Stage 2)
#
# ── 이 파일이 K8s에 말하는 것 ──
# "default 네임스페이스의 ExternalSecret들은 ap-northeast-2의 AWS Secrets Manager에서 값을 가져와라."
#
# ── auth 블록이 없는 이유 (비자명) ──
# 여기에 자격증명이 한 줄도 없다는 게 이번 Stage의 핵심이다.
# auth를 생략하면 ESO는 **컨트롤러 파드 자신의 자격증명**을 쓴다. 그 파드의 ServiceAccount에는
# IRSA 역할이 annotation으로 달려 있고(infra/aws-eks/2-cluster/irsa-eso.tf ⑩),
# AWS SDK가 마운트된 ServiceAccount 토큰으로 sts:AssumeRoleWithWebIdentity를 호출해
# 임시 자격증명을 받는다.
#   → 액세스키·시크릿키가 **매니페스트·이미지·etcd 어디에도 없다.**
#   → 권한 경계도 노드가 아니라 "external-secrets 네임스페이스의 external-secrets ServiceAccount"다.
#
# ⚠️ 대안이었던 `auth.jwt.serviceAccountRef`(앱 네임스페이스의 SA로 별도 역할을 맡는 방식)는
#    쓰지 않는다. 그 방식은 SecretStore마다 역할을 나눌 수 있어 멀티테넌트에 유리하지만,
#    단일 앱인 지금은 IAM 역할과 신뢰정책만 하나 더 늘 뿐 배우는 게 같다.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
