# ExternalSecret — core-api-app (JWT · GitHub OAuth) · EKS Stage 2
#
# DB 시크릿과 **일부러 분리**했다. 소유자와 수명이 다르기 때문:
#   core-api-db  → AWS가 소유(RDS가 만들고 로테이션하는 크리덴셜)
#   core-api-app → 우리가 소유(tofu가 생성한 JWT 키 + OAuth 자리표시)
# 한 덩어리로 묶으면 자동 로테이션 값과 수동 값이 섞이고, Stage 3에서 RDS를
# in-cluster Postgres로 갈아낄 때 db쪽만 교체하는 것도 불가능해진다.
#
# 🔴 여기 담기는 GitHub OAuth 값은 **prod의 실제 크리덴셜이 아니다** (자리표시).
#    학습 클러스터에 실서비스 OAuth 크리덴셜을 넣으면 그 클러스터가 진짜 사용자에게
#    유효한 토큰을 발급할 수 있게 된다. Stage 2 목표는 /health 200이지 로그인 e2e가 아니다.
#    (근거: infra/aws-eks/2-cluster/secrets.tf ⑨)
#
# 🔴 **JWT_SECRET도 같은 경계 안에 있다.** 키는 0-bootstrap이 환경별로 만들고
#    (`0-bootstrap/jwt-secret.tf`), 이 매니페스트가 읽는 시크릿의 이름에도 환경이
#    들어간다. 학습 클러스터의 ESO IRSA 역할은 prod 시크릿 ARN에 대한 권한이
#    아예 없으므로, 아래 key를 손으로 prod 이름으로 바꿔도 읽히지 않는다.
#    ⚠️ 단 이는 **두 배포가 공존 가능해질 때** 성립한다 — 지금은 state key·cluster_name이
#       환경별로 안 갈려 learning·prod 2-cluster를 동시에 못 세운다(QA F-2).
#       상세: `infra/aws-eks/0-bootstrap/jwt-secret.tf`
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: core-api-app
  namespace: default
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore

  target:
    name: core-api-app
    creationPolicy: Owner

  # dataFrom = 시크릿 JSON의 **모든 키를 그대로** K8s Secret 키로 펼친다.
  # data[]로 하나씩 나열하지 않는 이유: tofu가 넣는 JSON의 키 이름
  # (JWT_SECRET / GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET)이 이미 환경변수명과 같아서
  # 매핑이 항등이다. 나열하면 tofu와 여기 두 곳을 같이 고쳐야 하는 중복만 생긴다.
  #
  # 🔴 **이름을 코드에 박지 않는다 — 환경이 들어가기 때문이다.**
  #    시크릿 이름은 `<cluster_name>/<environment>/app` 이고(`2-cluster/secrets.tf`),
  #    여기에 `learning` 을 박아두면 prod 매니페스트를 따로 두거나 손으로 고쳐야 한다.
  #    `externalsecret-db.yaml` 이 이미 쓰는 것과 **같은 치환 관례**를 재사용한다:
  #
  #      NAME=$(tofu -chdir=infra/aws-eks/2-cluster output -raw app_secret_name)
  #      sed "s|APP_SECRET_NAME_PLACEHOLDER|$NAME|" k8s/eso/externalsecret-app.yaml \
  #        | kubectl apply -f -
  #
  #    ℹ️ 치환을 빠뜨리고 그대로 apply하면 ESO가 `APP_SECRET_NAME_PLACEHOLDER`라는
  #       시크릿을 찾다가 SecretSyncError를 낸다 — **시끄럽게 실패한다.** 조용히
  #       엉뚱한 환경의 키를 읽는 것보다 낫고, 애초에 IAM이 다른 환경을 막는다.
  dataFrom:
    - extract:
        key: APP_SECRET_NAME_PLACEHOLDER
