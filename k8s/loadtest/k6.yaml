# 부하 생성기 — k6 (계획서 `2026-09-05-memory-rightsizing.md` §9)
#
# 🔴 왜 셸 루프를 버렸나: 09-06 세션의 busybox wget 루프는 **자기 한계를 보고하지 못했다.**
#   서버가 한가한 것과 클라이언트가 못 밀어넣는 것이 **똑같이 "에러 0"** 으로 보였다.
#   k6 의 `constant-arrival-rate` 는 목표 RPS 를 못 지키면 `dropped_iterations` 로 **보고한다** —
#   그 한 지표가 *"서버 포화"* 와 *"생성기 병목"* 을 가른다.
#
# 실행 (스테이지당 한 번씩, 사이에 measure-memory.sh):
#   kubectl exec k6 -- k6 run -e RATE=25  /scripts/journey.js   # 스테이지1 =  75 req/s
#   kubectl exec k6 -- k6 run -e RATE=50  /scripts/journey.js   # 스테이지2 = 150 req/s
#   ... 100(300) · 200(600) · 400(1200)  — 계획서 §9.3 스테이지 표와 동일한 값이다
#
# 🔴 RATE 는 req/s 가 아니라 **회전/s** 다. 1 iteration = 요청 3개 → 실제 req/s = RATE × 3.
#    (로컬 실측: RATE=25 → http_reqs 75.29/s)
#
# ⚠️ 한 번에 램프를 돌리지 않는 이유: 스테이지별 요약이 깨끗하게 나오고,
#    무릎이 보이면 **즉시 멈춰 과금을 아낄 수 있다.**
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
data:
  journey.js: |
    import http from 'k6/http';

    // 호스트는 변수로, 경로는 사용처에 — 붙여 쓰면 gitleaks generic-api-key 가 오탐한다
    // (08-31·09-04 실제 발생, `k8s/README.md` §4.1).
    const DAILY = __ENV.DAILY || 'http://daily-api:8082';
    const CORE  = __ENV.CORE  || 'http://core-api:8080';
    const RATE  = parseInt(__ENV.RATE || '25');
    const DUR   = __ENV.DUR || '60s';

    // explain DTO 는 question·answer·feedback·userQuestion **네 개 모두** NotBlank.
    // 09-04 에 하나씩만 채워 400 을 두 번 맞았다.
    const BODY = JSON.stringify({
      question: '부하테스트', answer: '부하테스트',
      feedback: '부하테스트', userQuestion: '부하테스트',
    });
    const JSON_HDR = { headers: { 'Content-Type': 'application/json' } };

    export const options = {
      discardResponseBodies: true,   // 본문을 안 들고 있어야 k6 자신의 메모리가 안 샌다
      scenarios: {
        journey: {
          executor: 'constant-arrival-rate',  // 🔑 오픈 루프 — 서버가 느려도 도착률을 유지하려 한다
          rate: RATE, timeUnit: '1s', duration: DUR,
          preAllocatedVUs: 100, maxVUs: 2000,
        },
      },
      thresholds: {
        // 🔴 이 둘이 이 테스트의 판정이다. 통과/실패가 종료코드로 나온다.
        'http_req_failed':    ['rate<0.01'],
        'dropped_iterations': ['count<1'],   // >0 이면 **생성기가 병목** → 이 회차 데이터는 버린다
      },
    };

    // 1 iteration = 요청 3개 (= 1 회전). 따라서 실제 req/s ≈ RATE × 3.
    export default function () {
      http.get(`${DAILY}/api/v1/daily-question`);
      http.post(`${DAILY}/api/v1/daily-question/explain`, BODY, JSON_HDR);
      http.get(`${CORE}/api/v1/daily-question`);
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: k6
  labels:
    app: k6
spec:
  restartPolicy: Never

  # ── 🔴 생성기 격리 (계획서 §9.5 "측정 대상과 다른 노드에 고정") ──────────────
  #
  # 왜 필요한가: k6 는 requests cpu 500m — t4g.small 2 vCPU 의 **25%** 다. 측정 대상과
  # 같은 노드에 뜨면 앱의 CPU·메모리를 빼앗은 채로 그 앱을 측정하게 된다. 그러면
  # *"서버가 포화됐다"* 와 *"생성기가 옆에서 자원을 먹었다"* 가 **구분되지 않는다** —
  # 09-06 부하를 폐기하게 만든 실패(생성기 오염을 알 방법이 없음)와 정확히 같은 종류다.
  #
  # 🔴 **단순 nodeSelector 하나로는 안 된다.** 측정 대상이 4개(ai-api·core-api·daily-api·
  #   postgres)라 노드 2~3대를 **전부 채울 수 있다**(비둘기집). 빈 노드는 저절로 생기지 않는다.
  #   → **세션 절차에서 노드 하나를 비워 두고**, 아래 셋으로 거기에만 넣는다.
  #
  # ① nodeSelector — 라벨을 붙인 노드에만 간다. 라벨을 안 붙였으면 **Pending**(조용한 오염 대신 정지)
  # ② tolerations  — `cordon` 은 `node.kubernetes.io/unschedulable:NoSchedule` **taint** 다.
  #                  이게 없으면 비워 둔 노드에 k6 자신도 못 들어간다. cordon 과 짝이다.
  # ③ anti-affinity(required) — **가드**. 앱이 어쩌다 이 노드에 있으면 k6 가 Pending 으로
  #                  **시끄럽게 실패**한다. 막는 장치가 아니라 *침묵을 막는* 장치다.
  #                  ⚠️ preferred 로 낮추지 말 것 — 그러면 오염이 다시 조용해진다.
  #
  # 📋 세션 절차 — **스크립트가 한다. 손으로 치지 않는다** (계획서 §9.7):
  #
  #     sh k8s/loadtest/pin-loadgen-node.sh   # 노드 선택 → cordon+라벨 → 축출 → 0개 검증
  #     kubectl apply -f k8s/loadtest/k6.yaml
  #     kubectl get pod k6 -o wide            # ← 라벨 붙은 노드여야 한다. Pending = 격리 실패
  #
  # 🔴 **여기에 절차를 다시 적지 말 것.** 초판에 `kubectl get nodes | tail -1` 로 노드를 고르는
  #   예시를 적었다가 QA 에서 잡혔다(F-6) — **바로 위 ①②③ 설명과 정면으로 모순**이었다.
  #   `tail -1` 은 "측정 대상이 가장 적은 노드"를 보장하지 않는다. 주석은 스크립트보다 쉽게
  #   썩고, 과금 창에서는 **읽은 사람이 그대로 친다.** 절차의 단일 출처는 스크립트다.
  nodeSelector:
    devquest.io/role: loadgen

  tolerations:
    - key: node.kubernetes.io/unschedulable
      operator: Exists
      effect: NoSchedule

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          # 🔴 `namespaces` 를 명시한다 — 기본값은 *"이 파드 자신의 네임스페이스"* 라
          #   `kubectl apply` 컨텍스트가 default 가 아니면 **가드가 조용히 무력화된다.**
          #   같은 레포에 전례가 있다: `k8s/base/networkpolicy-ai-api.yaml` 이 정확히 같은
          #   이유로 네임스페이스를 못 박았다. 침묵을 막는 장치가 침묵하면 의미가 없다.
          namespaces: [default]
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [ai-api, core-api, daily-api, postgres]
  containers:
    - name: k6
      image: grafana/k6:0.58.0 # 태그 고정 — latest 는 세션마다 다른 것을 가리킨다
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: script
          mountPath: /scripts
      resources:
        # 🔴 생성기에 CPU 를 넉넉히 준다. 여기가 마르면 dropped_iterations 가 뜨고
        #    그 회차는 통째로 버려야 한다(= 과금 낭비). busybox 때와 달리 k6 는 무겁다.
        requests:
          cpu: 500m
          memory: 128Mi
        limits:
          memory: 512Mi
  volumes:
    - name: script
      configMap:
        name: k6-script
