# 부하 생성 파드 — 메모리 재산정 측정용 (docs/superpowers/plans/2026-09-05-memory-rightsizing.md)
#
# 🔴 왜 별도 파드인가: 측정 대상 컨테이너 안에서 부하 루프를 돌리면 **그 프로세스의 메모리가
#   측정값에 섞인다.** 09-04 e2e 는 daily-api 파드 안에서 wget 을 돌렸는데 그건 도달성 확인이라
#   상관없었다. 측정 중에는 안 된다.
#
# ⚠️ 이 파드는 **ai-api 를 직접 못 때린다** — networkpolicy-ai-api.yaml 이 core-api·daily-api 만
#   허용한다. 결함이 아니라 **C-5 가 살아 있다는 증거**다. ai-api 부하는 daily-api/explain 경유로만.
#
# ⚠️ 세션이 끝나면 반드시 지운다: kubectl delete -f k8s/loadtest/loadgen.yaml
#   (파드 슬롯을 먹고, 남아 있으면 다음 세션의 idle 기준선을 오염시킨다)
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgen-script
data:
  load.sh: |
    #!/bin/sh
    # $1 = 동시성(기본 20), $2 = 지속 초(기본 180)
    CONC="${1:-20}"; DUR="${2:-180}"
    # ⚠️ **호스트:포트와 경로를 한 토큰으로 붙여 쓰지 말 것.** 붙이면 gitleaks 의 generic-api-key 가
    #    오탐해 CI 가 막힌다(08-31·09-04 실제 발생). 아래처럼 호스트는 변수에, 경로는 사용처에 둔다.
    #    🔴 **유발 형태를 주석에 인용하지도 말 것** — 인용 자체가 재검출된다(`k8s/README.md` §4.1).
    DAILY="http://daily-api:8082"; CORE="http://core-api:8080"

    # explain DTO 는 question·answer·feedback·userQuestion **네 개 모두** NotBlank 다.
    # 09-04 에 하나씩만 채워 400 을 두 번 맞았다. 네 개를 다 채운 형태로 고정해 둔다.
    BODY='{"question":"부하테스트","answer":"부하테스트","feedback":"부하테스트","userQuestion":"부하테스트"}'
    CT='Content-Type: application/json'

    # busybox wget 은 상태코드를 안 돌려준다. 성공은 -S 의 헤더에, 실패는 에러 문구에 들어 있다 —
    # 두 형태 모두에서 3자리 코드를 뽑는다. (실패 시 wget 이 non-zero 지만 코드는 문구에 남는다)
    #
    # 🔴 코드가 안 뽑히면 **빈 문자열이 아니라 ERR 을 낸다.** 연결 자체가 안 될 때(DNS 실패·
    #    NetworkPolicy 차단·타임아웃) 빈 칸이 찍히면 마지막 집계에서 실패가 **보이지 않는다** —
    #    이 트랙이 반복해 온 "부재가 성공과 똑같이 생긴" 실패다. 로컬 실측으로 확인한 동작:
    #    200→200 · 404→404 · 도달불가→(빈 문자열) 이었다. 그 빈 문자열을 여기서 이름 붙인다.
    code() {
      c=$(wget -S -T 10 -O /dev/null "$@" 2>&1 | sed -n 's|.*HTTP/1\.[01] \([0-9][0-9][0-9]\).*|\1|p' | head -1)
      [ -n "$c" ] && echo "$c" || echo ERR
    }

    get_daily()   { code "$DAILY/api/v1/daily-question"; }
    post_explain(){ code --post-data "$BODY" --header "$CT" "$DAILY/api/v1/daily-question/explain"; }
    get_core()    { code "$CORE/api/v1/daily-question"; }

    if [ "$1" = "warmup" ]; then
      # 🔑 Metaspace 는 요청 수가 아니라 **밟은 코드 경로**로 자란다.
      #    만 번 GET 을 때려도 explain 을 안 밟으면 그 클래스는 안 올라온다.
      echo "GET  daily  -> $(get_daily)"
      echo "POST explain-> $(post_explain)"
      echo "GET  core   -> $(get_core)"
      exit 0
    fi

    if [ "$1" = "ratecheck" ]; then
      # 상향이 **먹었는지** 확인한다. 5회까지는 상향과 무관하게 성공하므로 6번째가 유일한 판별점.
      i=1; while [ $i -le 6 ]; do echo "explain #$i -> $(post_explain)"; i=$((i+1)); done
      echo "→ #6 이 200 이면 상향 적용됨. 429 면 미적용 — 부하를 걸지 말고 원인부터 볼 것."
      exit 0
    fi

    END=$(( $(date +%s) + DUR ))
    rm -f /tmp/w.*; echo "동시성 $CONC · ${DUR}초 시작"
    i=1
    while [ $i -le "$CONC" ]; do
      ( while [ "$(date +%s)" -lt "$END" ]; do
          { get_daily; post_explain; get_core; } >> "/tmp/w.$i"
        done ) &
      i=$((i+1))
    done
    wait
    echo "── 상태코드 분포 ──"; cat /tmp/w.* | sort | uniq -c | sort -rn
---
apiVersion: v1
kind: Pod
metadata:
  name: loadgen
  labels:
    app: loadgen # 측정 스크립트가 app=core-api 등으로 찾으므로 이 이름과 겹치지 않게 둔다
spec:
  # 부하 파드가 죽어서 재시작하면 부하 구간이 조용히 끊긴다. 명시적으로 실행/관측한다.
  restartPolicy: Never
  containers:
    - name: loadgen
      image: busybox:1.38.0 # 태그 고정 — latest 는 세션마다 다른 것을 가리킨다
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: script
          mountPath: /scripts
      resources:
        # 부하 파드 자신이 노드 예산을 눈에 띄게 먹으면 측정이 흔들린다. 작게 못박는다.
        requests:
          cpu: 50m
          memory: 16Mi
        limits:
          memory: 64Mi
  volumes:
    - name: script
      configMap:
        name: loadgen-script
