# ALB Ingress — Stage 4 (계획: `infra/aws-eks/README.md`)
#
# 이 파일 하나가 **AWS ALB 한 대**를 만든다. LBC(AWS Load Balancer Controller)가 이
# Ingress 오브젝트를 감시하다가 실제 ALB·리스너·타겟그룹을 만들고, 파드가 바뀌면
# 타겟을 따라 갱신한다. 즉 K8s 선언 → AWS 리소스 번역기다.
#
# 💰 **이 파일을 apply 하면 과금이 늘어난다**: ALB $0.0225/h + 퍼블릭 IPv4 $0.005/h × 2 AZ
#    = **+$0.0325/h** (세션 단가 $0.1299 → $0.1624/h, +25%).
#    ⚠️ 여기에 **LCU 가 별도**다. 09-08 램프(1200 req/s)를 ALB 경유로 돌리면 신규연결 LCU 만으로
#    최악 ~12 LCU × $0.008 = **$0.096/h** — ALB 고정비의 4배다.
#    → **부하 테스트와 Stage 4 를 같은 세션에 넣지 마라.** 예산 모델이 깨진다.
#
# 🔴 **teardown 에서 이 파일을 반드시 먼저 지운다.** ALB 는 tofu state 밖이라
#    `tofu destroy` 가 모른다. 남기면 **월 $16.43 + IP $7.30 이 조용히 나간다.**
#    (SOP §8 · `eks-reaper.sh` 참조 — 리퍼도 이제 이걸 지운다)
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devquest
  annotations:
    # ── ① 인터넷에서 접근 가능하게 ────────────────────────────────
    # `internal` 이면 VPC 안에서만 도달한다. 학습 목표가 외부 노출이므로 internet-facing.
    alb.ingress.kubernetes.io/scheme: internet-facing

    # ── ② 🔴 target-type: ip — 이 한 줄이 이 파일에서 가장 중요하다 ──
    #
    # 기본값은 `instance` 이고, 그건 **Service 가 NodePort 여야** 동작한다.
    # 우리 세 Service 는 전부 `ClusterIP` 다(core-api.yaml·daily-api.yaml·ai-api.yaml).
    # 기본값 그대로 두면 어떻게 되나:
    #   - `kubectl apply` 는 성공한다. Ingress 오브젝트가 `created` 로 뜬다
    #   - **ALB 는 안 생긴다**
    #   - 에러는 `kubectl describe ingress devquest` 의 Events 에만 남는다
    # 즉 **조용히 실패한다** — 이 레포가 반복해서 데인 형태다(부재가 성공과 똑같이 생긴 실패).
    #
    # `ip` 모드는 ALB 가 **파드 IP 로 직접** 트래픽을 보낸다. VPC CNI 가 파드에 VPC IP 를
    # 주기 때문에 가능하다(그래서 이건 EKS 고유 기능이다 — kind 로는 배울 수 없다).
    # 부수 효과: 노드를 한 번 안 거치므로 홉이 하나 줄고, NodePort 범위를 열 필요가 없다.
    alb.ingress.kubernetes.io/target-type: ip

    # ── ③ 🔴 헬스체크 경로 — 기본값 `/` 는 401 이다 ────────────────
    #
    # `SecurityConfig.kt` 가 `anyRequest().authenticated()` 이고 permitAll 목록에 `/` 가 없다.
    # 기본값을 그대로 두면:
    #   ALB 가 `/` 를 찌름 → 401 → success-codes(200) 불일치 → **전 타겟 unhealthy → 502**
    #   그런데 `kubectl get pods` 는 **1/1 Running** 이다. kubelet 은 `/health` 를 찌르니까.
    # → 파드는 멀쩡해 보이는데 밖에서만 502 다. 원인이 앱에 있다고 착각하기 딱 좋다.
    #
    # `/health` 는 상수를 반환하는 liveness 용 엔드포인트다(`core-api.yaml` 참조).
    # ALB 헬스체크에는 그게 **옳다** — DB 가 흔들릴 때 ALB 가 전 타겟을 빼버리면
    # 장애를 복구하는 게 아니라 증폭시킨다. 트래픽 제외 판단은 readiness(kubelet)가 한다.
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: "200"

    # ── ④ HTTP 만 연다 ────────────────────────────────────────────
    # HTTPS 는 ACM 인증서 + 도메인이 필요하고, 이 클러스터는 세션마다 사라진다.
    # Stage 4 의 학습 목표는 **IngressClass·target-type·컨트롤러 동작**이지 TLS 종료가 아니다.
    # ⚠️ 그래서 이 Ingress 로는 **로그인·토큰을 태우지 마라.** 평문이다.
    #    학습 클러스터의 OAuth 자격증명이 자리표시인 것과 같은 이유로 실제 인증을 쓰지 않는다.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

    # ── ⑤ 태그 — 고아가 됐을 때 정체를 알 수 있게 ──────────────────
    # LBC 는 자동으로 `elbv2.k8s.aws/cluster` 태그를 붙이지만, 우리 인벤토리 규약
    # (`PERSISTENT-RESOURCES.md` 의 `Persistent` 태그)과 대조하려면 우리 태그도 필요하다.
    # 🔑 **`Persistent=false` 를 명시한다** — 영속 EBS 와 반대다. 고아 검사(SOP §9)가
    #    "Persistent 태그 없는 것 = 고아" 로 판정하므로, 여기에 true 를 붙이면 **영원히 안 잡힌다.**
    alb.ingress.kubernetes.io/tags: Project=devquest,Stage=4,Persistent=false
spec:
  # 차트가 만들어 주는 IngressClass 다(`createIngressClassResource: true` 가 기본값).
  # 🔴 `ingressClassName` 대신 옛 annotation `kubernetes.io/ingress.class: alb` 를 쓰지 마라 —
  #    deprecated 이고, 둘을 같이 쓰면 annotation 이 이긴다(조용한 우선순위 역전).
  ingressClassName: alb

  # ── 🔴 경로 순서가 의미를 갖는다 ────────────────────────────────
  #
  # **두 서비스가 `/api/v1/daily-question` 을 똑같이 서빙한다.** Phase 2 strangler 이관이
  # 롤백 보존을 위해 core-api 쪽 구현을 남겨뒀기 때문이다(`CONTEXT.md` — "client-ai 의존 제거 금지").
  # 실측:
  #   core-api  : /api/v1/{ai-check,auth,coach,coding,companies,daily-question,progress,resume,
  #                         tech-interview,user}
  #   daily-api : /api/v1/daily-question                     ← 겹침
  #
  # 그래서 단순 prefix 분할이 성립하지 않는다. 대신 **구체적인 것을 먼저** 둔다:
  #   ① /api/v1/daily-question → daily-api   (새 서비스로 보낸다)
  #   ② /api/v1               → core-api    (나머지 전부)
  #
  # 🔑 이게 strangler 패턴의 실제 모습이다 — 라우터가 경로 단위로 트래픽을 새 서비스에
  #    옮기고, 문제가 생기면 ① 규칙 하나만 지워서 즉시 되돌린다. Phase 2 가 "전환 가능"까지
  #    해두고 "전환 완료"를 안 한 이유가 이 되돌림 여지를 남기려는 것이었다.
  #
  # ⚠️ **LBC 는 rules 배열 순서대로 ALB 규칙 우선순위를 매긴다.** 아래 두 항목을 바꿔 쓰면
  #    `/api/v1` 이 먼저 매칭되어 **daily-api 로는 트래픽이 한 건도 안 간다.** 그리고 그건
  #    에러가 아니라 "잘 도는 것처럼" 보인다 — core-api 에도 같은 엔드포인트가 있으니 200 이 온다.
  #    🔴 검증할 때 **응답 코드가 아니라 어느 파드 로그에 찍혔는지**를 봐라.
  #
  # 📌 노출하지 않는 것: `/actuator/**` · `/health` · ai-api.
  #    - actuator 를 라우팅하지 않으므로 외부에서 도달 불가다. `SecurityConfig` 의
  #      `/actuator/health/readiness` permitAll 은 **kubelet 용**이었지 인터넷용이 아니다
  #      (그 룰이 만들어질 때 ALB 는 없었다). 라우팅으로 막는 게 코드를 고치는 것보다 얕고 안전하다.
  #    - ai-api 는 `networkpolicy-ai-api.yaml` 이 default-deny 라 ALB ENI 를 거부한다.
  #      뚫으려면 #409 에서 검증한 C-5 를 무효화해야 하므로 **일부러 제외**했다.
  rules:
    - http:
        paths:
          - path: /api/v1/daily-question
            pathType: Prefix
            backend:
              service:
                name: daily-api
                port:
                  number: 8082
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: core-api
                port:
                  number: 8080
