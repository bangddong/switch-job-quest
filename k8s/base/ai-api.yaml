# ai-api Deployment + Service (Phase 2 Stage C)
#
# AI 평가 전담 서비스. **클러스터 내부 전용** — 외부에서 직접 부르지 않는다.
# `daily-api` 가 `http://ai-api:8081` 로 호출하고, 그 접근 통제는 networkpolicy-ai-api.yaml 이 한다.
#
# ⚠️ image 태그는 <git-sha>로 교체해서 적용한다. latest 금지(추적·롤백 불가).
#
# 적용:
#   IMAGE=<account>.dkr.ecr.ap-northeast-2.amazonaws.com/devquest/ai-api:<sha>
#   sed "s|IMAGE_PLACEHOLDER|$IMAGE|" k8s/base/ai-api.yaml | kubectl apply -f -
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-api
  labels:
    app: ai-api
spec:
  replicas: 1

  # core-api.yaml 과 같은 이유로 Recreate. RollingUpdate 는 maxSurge 만큼 **빈 파드 슬롯**을 요구하는데
  # 이 노드는 슬롯이 유한하다. 여유가 있어도 롤아웃이 구조적으로 슬롯을 먹는 사실은 같다.
  # ~~(t4g.medium = 17)~~ 🔴 **D-009 잔재였다 (2026-09-03 정정, QA F-4).** 그 타입은 이 계정에서
  #   launch 되지 않는다(D-010) → 노드는 t4g.small, 슬롯은 **노드당 11**. Stage C 재개는 **3대 = 33칸**
  #   이고 총 15칸을 쓰므로 슬롯은 여유가 있다. 🔑 지금 Recreate 를 유지하는 이유는 슬롯이 아니라
  #   **메모리**다 — RollingUpdate 는 새 파드(512Mi)를 먼저 띄우므로 노드 여유(비관 447Mi)에 안 들어간다.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: ai-api
  template:
    metadata:
      # 🔴 **NetworkPolicy 의 podSelector 가 보는 것이 바로 이 레이블이다.**
      #    (Deployment 의 metadata.labels 가 아니다 — 그쪽은 정책과 무관하다.)
      #    여기를 빠뜨리거나 오타를 내면 정책이 **0개 파드를 선택**하고, 생성은 성공하며,
      #    아무것도 막지 않는다. networkpolicy-ai-api.yaml 의 podSelector 와 반드시 일치시킬 것.
      labels:
        app: ai-api
    spec:
      containers:
        - name: ai-api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081 # ai-api/application.yml 의 server.port
          env:
            # ⚠️ 현재 ai-api 에는 application-prod.yml 이 **없다**(의도적 — Stage C 준비 C-7 참조.
            #    ai-api 의 유일한 실행 환경이 이 학습 클러스터이고 DEBUG 로그가 관측 수단이다).
            #    그래도 이 값을 세팅해 둔다: 나중에 누가 application-prod.yml 을 추가했을 때
            #    **프로필이 활성화되지 않아 조용히 무시되는 함정**을 미리 막는다.
            - name: SPRING_PROFILES_ACTIVE
              value: prod

            # 🔴 D-008 — 학습 클러스터에서는 실제 Anthropic 을 부르지 않는다.
            #    `secrets.tf` 가 *"학습 클러스터에 prod 크리덴셜을 넣지 않는다"* 를 원칙으로 못박았고,
            #    같은 파일이 더미 Grafana 키를 넣었다가 실제 스택에 인증 시도가 새어나간 사고를 기록해뒀다.
            #    → ANTHROPIC_API_KEY 를 주입하지 않고 스텁을 켠다. 응답에 `[STUB]` 표식이 붙는다.
            #
            #    ⚠️ 이 값이 없으면 부팅은 성공하고 **AI 호출 시점에 실패**한다
            #    (client-ai-anthropic.yml 의 `${ANTHROPIC_API_KEY:}` 가 빈 문자열 기본값이라
            #     컨텍스트 로드는 통과한다). CrashLoop 가 아니라 런타임 실패라 진단이 늦다.
            - name: DEVQUEST_AI_STUB_TECH_INTERVIEW_ENABLED
              value: "true"

          # ⚠️ envFrom 이 없다. ai-api 는 DB 도(db-core 미의존) JWT/OAuth 도 쓰지 않는다.
          #    core-api 를 복제하며 `core-api-db`·`core-api-app` 을 딸려오게 하지 말 것 —
          #    쓰지 않는 시크릿을 파드에 넣는 것은 노출 표면만 넓힌다.

          # startup/liveness = /health (상수). readiness = actuator.
          # 🔑 ai-api 의 readiness 그룹은 `ping` 만 포함한다 — 검사할 외부 의존이 없기 때문이다
          #    (db-core 미의존. `db,ping` 을 넣으면 NoSuchHealthContributorException 으로 **기동 실패**).
          #    즉 현재 이 readiness 는 liveness 와 사실상 같은 신호다(원장 L-39, Judge0 붙으면 확장).
          #    그래도 경로를 분리해 두는 이유는 나중에 인디케이터를 추가할 때 **매니페스트를 안 고쳐도** 되게 하기 위함.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3

          # core-api 와 동일하게 잡는다. ai-api 는 스텁 모드라 실사용이 더 가벼울 가능성이 높지만,
          # ⚠️ **ai-api 의 힙·Metaspace 실사용 측정치가 레포에 0건**이라 근거 있는 축소가 불가능하다
          #    (Dockerfile 의 JVM 플래그는 Fly 512MB 예산에서 나왔고 실측 근거는 core-api prod 하나뿐).
          #    검증된 값에서 출발하고, apply 세션에서 실측한 뒤 조정한다.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 900Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-api
spec:
  # ClusterIP — 클러스터 내부 전용. daily-api 가 `http://ai-api:8081` 로 이 이름을 푼다.
  # ⚠️ LoadBalancer 금지: NLB 가 tofu state 밖에 생겨 destroy 후에도 과금된다(Stage 1 교훈).
  #    ai-api 는 애초에 외부 노출 대상이 아니다 — `/internal/ai/**` 는 인증이 없다.
  type: ClusterIP
  selector:
    app: ai-api
  ports:
    - name: http
      port: 8081
      targetPort: http
