# daily-api Deployment + Service (Phase 2 Stage C)
#
# 무로그인 "오늘의 질문" 서비스. Stage C e2e 의 진입점이다
# (`kubectl port-forward svc/daily-api 8082:8082` → 외부 노출 없이 검증. C-6 결정).
#
# 데이터 흐름:
#   GET  /api/v1/daily-question          → postgres (뱅크 전용 lazy 생성, **AI 호출 없음**)
#   POST /api/v1/daily-question/explain  → ai-api (HTTP) → 스텁 응답
#
# ⚠️ image 태그는 <git-sha>로 교체해서 적용한다. latest 금지.
#
# 적용:
#   IMAGE=<account>.dkr.ecr.ap-northeast-2.amazonaws.com/devquest/daily-api:<sha>
#   sed "s|IMAGE_PLACEHOLDER|$IMAGE|" k8s/base/daily-api.yaml | kubectl apply -f -
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daily-api
  labels:
    app: daily-api
spec:
  replicas: 1
  strategy:
    type: Recreate # core-api.yaml 과 같은 이유(파드 슬롯)
  selector:
    matchLabels:
      app: daily-api
  template:
    metadata:
      # 🔴 networkpolicy-ai-api.yaml 의 `from.podSelector` 가 보는 레이블이다.
      #    여기가 어긋나면 daily-api 가 **허용 목록에서 빠져** ai-api 호출이 막히고,
      #    증상(타임아웃)이 "정책이 잘 도는 것"과 구별되지 않는다.
      labels:
        app: daily-api
    spec:
      containers:
        - name: daily-api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082 # daily-api/application.yml 의 server.port
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod

            # 🔴 **C-8 — 이게 없으면 daily-api 가 자기 자신을 호출한다.**
            #    `DailyAiConfig` 의 기본값이 `http://localhost:8081` 인데(로컬 개발 기준),
            #    daily-api 자신의 포트는 8082 다. prod yml 에 이 키가 없으므로 여기서 반드시 준다.
            #    ⚠️ 안 넣으면 연결 실패가 나는데, 그 증상이 **NetworkPolicy 차단과 구별되지 않는다**
            #       — 같은 세션에 정책을 걸어놨다면 원인을 정책으로 오귀속하게 된다.
            - name: DEVQUEST_AI_HTTP_BASE_URL
              value: http://ai-api:8081

            # 오늘의 질문은 **날짜 경계**가 동작을 가른다(Asia/Seoul 기준 하루 1건).
            # 코드가 `ZoneId.of("Asia/Seoul")` 을 명시하고 있어 이 값 없이도 정확하지만,
            # **로그 타임스탬프**가 UTC 로 찍히면 "왜 어제 질문이 나오지" 를 디버깅할 때 혼란스럽다.
            # core-api 와 같은 이유로 맞춘다(Dockerfile 의 -Duser.timezone 과 이중 안전장치).
            - name: TZ
              value: Asia/Seoul

          # DB 접속 정보. **`core-api-db` Secret 을 core-api 와 공유한다** — 새로 만들지 않는다.
          # 그 Secret 이 만드는 4키(DB_HOST/DB_NAME/DB_USERNAME/DB_PASSWORD)가
          # daily-api 의 application-prod.yml 이 요구하는 것과 **정확히 일치**한다.
          #
          # ⚠️ `core-api-app`(JWT/OAuth)은 넣지 않는다 — daily-api 는 무로그인 서비스라 쓰지 않는다.
          # 🟡 이름이 `core-api-*` 라 3서비스가 공유하는 지금은 소유권이 흐려 보인다.
          #    이름을 바꾸려면 ESO 3파일 + core-api.yaml + postgres*.yaml 을 동시에 고쳐야 해서 이번 범위 밖.
          envFrom:
            - secretRef:
                name: core-api-db

          # ⚠️ **마이그레이션은 core-api 만 실행한다** — `devquest.flyway.migrate-on-startup` 을 켜지 않는다.
          #    daily-api 는 db-core 만 의존해 클래스패스에 core-api 소유 마이그레이션(V1~V6,V8,V9)이 없다.
          #    켜면 `repair()` 가 그것들을 `flyway_schema_history` 에서 DELETED 로 마킹하고,
          #    core-api 가 다음 기동에 V1 부터 재실행하다 CREATE TABLE 충돌로 **영구 부팅 불가**에 빠진다
          #    (2026-07-01 V8 사고와 동일 경로). 기본값이 off 라 아무것도 안 하면 안전하다.

          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          # /health 는 상수라 DB 가 죽어도 200 이다(재시작 폭풍 방지).
          # readiness 는 실제 DB 를 본다(그룹 `db,ping`) → DB 장애 시 트래픽에서만 빠진다. 원장 L-15.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 900Mi
---
apiVersion: v1
kind: Service
metadata:
  name: daily-api
spec:
  # ClusterIP. 외부 접근은 `kubectl port-forward` 로 한다(C-6 결정 — Ingress 는 Phase 3).
  # ⚠️ LoadBalancer 금지: ALB/NLB 가 tofu state 밖에 생겨 destroy 후에도 과금된다.
  type: ClusterIP
  selector:
    app: daily-api
  ports:
    - name: http
      port: 8082
      targetPort: http
