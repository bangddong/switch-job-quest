# core-api Deployment + Service (EKS Stage 1)
#
# 이 파일이 K8s에 말하는 것: "이 이미지를 1개 띄우고, 죽으면 살리고, 안정적인 이름으로 접근하게 해줘."
#
# ⚠️ image 태그는 <git-sha>로 교체해서 적용한다 (아래 apply 절차 참고). latest 금지:
#    "지금 뭐가 도는지" 추적 불가 + 롤백 불가 + 노드마다 다른 이미지가 뜰 수 있다.
#
# 적용:
#   IMAGE=<account>.dkr.ecr.ap-northeast-2.amazonaws.com/devquest/core-api:<sha>
#   sed "s|IMAGE_PLACEHOLDER|$IMAGE|" k8s/base/core-api.yaml | kubectl apply -f -
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  labels:
    app: core-api
spec:
  # 학습장이라 1개. 실무 prod는 최소 2 + PodDisruptionBudget(무중단 배포/노드 드레인 대비).
  replicas: 1
  selector:
    # Deployment가 "내 파드"를 찾는 기준. 아래 template.metadata.labels와 반드시 일치해야 한다.
    matchLabels:
      app: core-api
  template:
    metadata:
      labels:
        app: core-api
    spec:
      containers:
        - name: core-api
          image: IMAGE_PLACEHOLDER
          # IfNotPresent: 같은 태그면 노드 캐시 재사용. sha 태그는 불변이라 이게 안전하고 빠르다.
          # (latest를 쓴다면 Always여야 하는데, 그 자체가 latest를 쓰면 안 되는 이유이기도 하다.)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # JVM 기본 zone을 KST로 만든다. **이 값만으로 정상 동작한다** — 이미지 직접 실측:
            #   TZ 미설정 → ZoneId.systemDefault()=GMT / TZ=Asia/Seoul → Asia/Seoul
            #   (eclipse-temurin alpine에는 tzdata가 포함돼 있다. "Alpine엔 tzdata 없음" 통설은 여기 해당 안 됨)
            # Dockerfile의 `-Duser.timezone=Asia/Seoul`은 이 설정이 유실돼도 버티게 하는 이중 안전장치.
            - name: TZ
              value: Asia/Seoul
          # DB 접속 정보는 코드에 없다(application-prod.yml이 100% 환경변수 기반).
          # 그래서 "코드 변경 0"으로 Neon↔RDS↔in-cluster Postgres를 갈아끼울 수 있다.
          #
          # 두 Secret 모두 **External Secrets Operator가 자동 생성**한다(Stage 2).
          # 손으로 `kubectl create secret` 하지 않는다 — k8s/eso/ 참고.
          # 시크릿을 둘로 나눈 이유는 소유자가 다르기 때문:
          #   core-api-db  = AWS 소유 (RDS가 만들고 로테이션하는 크리덴셜 + 접속 좌표)
          #   core-api-app = 우리 소유 (tofu가 생성한 JWT 키 + GitHub OAuth 자리표시)
          #
          # ⚠️ envFrom은 나중 항목이 앞 항목의 같은 키를 덮어쓴다. 지금은 키가 겹치지 않지만
          #    (DB_* vs JWT_SECRET/GITHUB_*), 새 키를 추가할 때 충돌 여부를 확인할 것.
          envFrom:
            - secretRef:
                name: core-api-db
            - secretRef:
                name: core-api-app
          resources:
            # requests = 스케줄러가 노드 자리를 잡을 때 쓰는 "예약값"
            # limits   = 초과 시 CPU는 스로틀, 메모리는 OOMKill
            # t4g.small(2GB) 1대에 시스템 파드까지 얹혀야 하므로 보수적으로 잡는다.
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 900Mi # JVM이 컨테이너 한계를 인지(-XX:+UseContainerSupport)해 힙을 계산한다
          # startupProbe: 느린 기동을 보호. Spring + Flyway + Neon cold start로 2~3분 걸릴 수 있어
          #   이게 없으면 liveness가 기동 중인 앱을 "죽었다"고 판단해 무한 재시작 루프에 빠진다.
          #   failureThreshold × periodSeconds = 30 × 10s = 최대 5분 허용.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 30
          # livenessProbe: 죽었으면 재시작 (교착·데드락 회복)
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          # readinessProbe: 트래픽 받을 준비가 됐나. 실패 시 Service 엔드포인트에서 제외(재시작은 안 함)
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
spec:
  # ClusterIP: 클러스터 내부 전용 가상 IP. 파드는 죽고 살아나며 IP가 바뀌지만 이 이름/IP는 고정이다.
  #
  # ⚠️ 여기서 type: LoadBalancer를 쓰지 않는 이유 = 비용.
  #    LoadBalancer로 만들면 K8s가 AWS에 NLB를 자동 생성한다 → tofu state 밖의 리소스가 되고,
  #    destroy 때 고아로 남아 계속 과금된다(Stage 1의 핵심 교훈).
  #    외부 접근이 필요하면 kubectl port-forward로 충분하다(무료, 임시).
  type: ClusterIP
  selector:
    app: core-api # 이 라벨을 가진 파드로 트래픽을 보낸다
  ports:
    - name: http
      port: 8080
      targetPort: http
