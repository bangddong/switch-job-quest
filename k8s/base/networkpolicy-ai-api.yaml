# ai-api 격리 정책 (Phase 2 Stage C 블로커 C-5)
#
# `ai-api` 의 `/internal/ai/**` 24개 엔드포인트는 **인증이 없다** — Spring Security 의존 자체가 없다
# (`be/core/ai-api/build.gradle.kts` 의존 4개: core-domain, client-ai, starter-web, starter-actuator).
# 설계가 처음부터 *"내부 전용이니 네트워크로 막는다"* 로 갔기 때문이고, **그 통제가 이 파일이다.**
# 이게 없으면 방어가 네트워크·앱 양층 모두 0이다.
#
# 적용:
#   kubectl apply -f k8s/base/networkpolicy-ai-api.yaml
#
# ══════════════════════════════════════════════════════════════════════════
# 🔴 이 파일이 **아무것도 안 막으면서 성공한 것처럼 보이는** 경로가 셋 있다
# ══════════════════════════════════════════════════════════════════════════
#
# ① **CNI 가 강제하지 않으면 조용히 무시된다.**
#    NetworkPolicy 는 K8s 코어 API(`networking.k8s.io/v1`)라 CRD 가 아니다 → 강제하는 CNI 가 없어도
#    API 서버가 정상 수용하고 `... created` 를 출력한다. **에러도 경고도 없다.**
#    전제: `2-cluster/addons.tf` 의 vpc-cni 에 `enableNetworkPolicy = "true"` (스키마 실측: 문자열).
#    ⚠️ apply 순서를 반드시 지킬 것 — 애드온 먼저, 이 파일은 그다음.
#
# ② **podSelector 가 0개 파드를 매칭해도 생성은 성공한다.**
#    `podSelector` 가 보는 것은 **파드 레이블**(`spec.template.metadata.labels`)이다.
#    Deployment 의 `metadata.labels` 가 아니다. `ai-api.yaml`·`daily-api.yaml` 의 template 레이블과
#    아래 셀렉터가 **글자 단위로** 일치해야 한다.
#    확인: `kubectl get netpol -o wide` 의 POD-SELECTOR ↔ `kubectl get pods -l app=ai-api`
#    (`kubectl describe netpol` 은 **몇 개 파드를 매칭했는지 알려주지 않는다**.)
#
# ③ **네임스페이스가 어긋나면 조용히 무력화된다.**
#    `k8s/base/*` 의 다른 파일들은 `namespace` 를 안 적고 kubectl 컨텍스트에 의존한다.
#    Deployment 가 엉뚱한 ns 로 가면 Secret 이 없어 **시끄럽게** 실패하지만,
#    정책이 엉뚱한 ns 로 가면 **아무 일도 일어나지 않는다.** → 여기서는 명시한다.
#
# ══════════════════════════════════════════════════════════════════════════
# 왜 ingress 만 거는가 (egress 를 넣지 않는 이유)
# ══════════════════════════════════════════════════════════════════════════
#
# `policyTypes` 에 `Egress` 를 추가하는 순간 그 파드의 **아웃바운드가 default-deny** 가 된다.
# 그러면 **DNS(53/UDP·TCP → kube-system 의 coredns)** 를 명시 허용하지 않는 한 이름 해석이 전부 죽는다.
# ai-api 는 스텁 모드라 아웃바운드가 없어 "egress 도 잠그면 더 안전하지 않나" 하는 유혹이 크지만,
# **얻는 것 대비 e2e 를 깨뜨릴 확률이 훨씬 높다.** Stage C 는 ingress-only 로 못박는다.
#
# ℹ️ ingress 만 걸면 **호출자 쪽 egress 에는 아무 영향이 없다.** daily-api 가 `ai-api` 이름을 푸는 것은
#    daily-api 의 egress 이고 이 정책과 무관하다 → **DNS 는 안 끊긴다.**
#
# ══════════════════════════════════════════════════════════════════════════
# 이 정책이 해결하지 **않는** 것 (과대평가 방지)
# ══════════════════════════════════════════════════════════════════════════
#
# `ai-api/application.yml` 의 `spring.web.error.include-message: always`(에러 원문 노출)는
# 그 근거로 *"Phase 3 에서 NetworkPolicy 로 차단할 계획"* 을 들었다. 하지만 이 정책은
# **core-api·daily-api 를 허용**하므로 에러 메시지는 여전히 그 둘에게 그대로 흘러간다.
# → 정책이 줄이는 것은 **폭발 반경**(호출자 2개로 한정)이지 노출 자체가 아니다.
#    이 파일을 근거로 그 주석을 "부채 상환 완료" 로 고치지 말 것.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-api-allow-internal-callers
  namespace: default # 🔴 위 ③ — 명시한다
  labels:
    app: ai-api
spec:
  # 이 정책이 보호하는 대상: ai-api 파드
  podSelector:
    matchLabels:
      app: ai-api # 🔴 위 ② — ai-api.yaml 의 spec.template.metadata.labels 와 일치해야 한다

  # 🔑 Ingress 만 선언한다. Egress 를 넣지 않는 이유는 위 참조.
  #    여기에 `Ingress` 를 적는 순간 ai-api 파드의 **인바운드는 default-deny** 가 되고,
  #    아래 from 목록에 있는 것만 통과한다.
  policyTypes:
    - Ingress

  ingress:
    - from:
        # daily-api — Stage C e2e 가 실제로 타는 경로
        #   POST /api/v1/daily-question/explain → ai-api 의 /internal/ai/tech-interview/... (8081)
        - podSelector:
            matchLabels:
              app: daily-api

        # core-api — 🟡 **이번 세션에는 한 번도 실행되지 않는 규칙이다.**
        #   core-api 는 `devquest.ai.transport: inprocess` 라 ai-api 를 HTTP 로 부르지 않는다
        #   (`AiHttpClientConfig` 의 `@ConditionalOnProperty(havingValue = "http")` 게이트가 닫혀 있다).
        #   → 즉 이 규칙은 **작동한다고 믿지만 통과시켜본 적 없는** 상태로 남는다.
        #   그래도 미리 넣는 이유: Phase 3 에서 `transport=http` 로 켰을 때 여기서 막히면
        #   원인을 찾기 어렵다(증상이 타임아웃이라 AI 지연과 구별이 안 된다).
        - podSelector:
            matchLabels:
              app: core-api

      # 포트를 좁힌다 — 허용된 호출자라도 8081(HTTP) 외의 포트는 못 연다.
      ports:
        - protocol: TCP
          port: 8081
# ══════════════════════════════════════════════════════════════════════════
# 검증 — "생성됐다" 는 증명이 아니다. **차단/허용 쌍**으로만 증명된다
# ══════════════════════════════════════════════════════════════════════════
#
# 파드 슬롯을 1칸도 안 먹는 방법: 임시 파드를 띄우지 않고 **이미 뜬 postgres-0 에 exec** 한다
# (`kubectl run` 선례는 레포에 0건, exec+wget 선례는 있다 — docs/eks-tutorial-steps.md).
#
#   1. ai-api·daily-api 둘 다 Ready 확인
#   ⚠️ URL 은 변수로 둔다(`AI_URL` 에 호스트·포트만) — 경로까지 붙여 쓰면 gitleaks 가
#      generic-api-key 오탐을 낸다(2026-08-31 실제로 CI 가 막혔다). 상세 절차는 k8s/README.md §4.1.
#   2. 🔑 **정책 적용 전**:  kubectl exec postgres-0 -- wget -qO- --timeout=5 "$AI_URL/actuator/health"
#                            → **성공해야 한다** (도달성 + wget 존재 + Service 셀렉터 + DNS 를 한 번에 확정)
#   3. kubectl apply -f k8s/base/networkpolicy-ai-api.yaml
#   4. 동일 명령 재실행    → **타임아웃/행** 이어야 한다  (VPC CNI 의 거부는 Connection refused 가 아니다)
#   5. kubectl exec <daily-api 파드> -- wget ... → **여전히 성공**해야 한다 (양성 대조)
#   6. kubectl get pod -l app=ai-api -w → RESTARTS 가 0 인지 최소 1 probe 주기 관찰
#      (만에 하나 kubelet→파드 probe 가 막히면 startupProbe 실패로 컨테이너가 죽는데,
#       그 증상이 C-7(헬스 엔드포인트 부재)과 **구별 불가능**하다)
#
# ⚠️ **2단계가 없으면 4단계는 아무것도 증명하지 않는다** — 파드 미기동·Service 셀렉터 오류·DNS 실패가
#    전부 "막혔다"와 똑같이 생겼다.
# ⚠️ **5단계가 없으면** `podSelector: {}` + 빈 ingress(전면 차단)도 4단계를 "통과" 한다.
#    그건 Stage C 완료 기준(daily-api → ai-api 왕복)을 정면으로 깨는 정책이다.
# ⚠️ [미확인] `postgres:17-alpine` 에 wget 이 있는지 레포 기록 0건. 이 레포는 정확히 이 가정으로 데인 적이 있다
#    (실측: `sh: openssl: not found`). 2단계가 그 확인을 겸한다.
