# ArgoCD Helm 값 (Stage 5c) — 차트 argo/argo-cd 10.10.2 (ArgoCD v3.5.4)
#
# 설치:
#   helm repo add argo https://argoproj.github.io/argo-helm
#   helm install argocd argo/argo-cd --version 10.10.2 -n argocd --create-namespace \
#     -f k8s/argocd/values.yaml
#
# 기본값으로 깔면 파드가 7개 뜨고 requests 가 하나도 없다. 학습 클러스터(t4g.small ×3)에서는
#   - 파드 수가 아깝다(노드당 11개 상한),
#   - requests 가 없으면 스케줄러가 "메모리 0 을 쓴다"고 보고 아무 노드에나 밀어 넣는다.
# 그래서 안 쓰는 부품을 끄고 requests 를 적는다.

# ── 끄는 부품 ────────────────────────────────────────────────────────────────
dex:
  enabled: false # SSO(외부 로그인) 연동. 혼자 쓰므로 필요 없다.
notifications:
  enabled: false # Slack 등 알림.
applicationSet:
  replicas: 0 # Application 을 여러 개 찍어내는 부품. 한 개만 쓴다.
  # ℹ️ 이 차트 버전에는 enabled 스위치가 없다. Deployment 는 남고 파드만 0 이 된다.

# ── 켜 두는 부품 4개 ─────────────────────────────────────────────────────────
# 🟡 아래 memory 는 추정치다. 세션에서 `kubectl top pod -n argocd` 로 실측해 고친다(P1).
controller: # git 과 클러스터를 비교하고 맞추는 본체
  resources:
    requests: { cpu: 100m, memory: 256Mi }
repoServer: # git 을 내려받아 Kustomize 를 돌리는 부품
  resources:
    requests: { cpu: 50m, memory: 128Mi }
server: # 화면 + API. 밖으로 열지 않는다 — kubectl port-forward 로만 본다.
  resources:
    requests: { cpu: 50m, memory: 96Mi }
redis: # 위 셋이 쓰는 캐시. 지워져도 다시 만들어진다.
  resources:
    requests: { cpu: 10m, memory: 32Mi }
