# 📌D-016 순서표 5-B — prod DB 비밀번호의 원천은 SSM Parameter Store 다(계획서 「5번」 결정).
#   EC2 가 첫 부팅 때 만들어 `/devquest/prod/db/password` 에 쓴다. tofu state 에 없다(PR 역할이 읽는 state — B3-6).
#   ESO 는 같은 IRSA(`devquest-eks-eso`)로 읽는다 — 정책은 `2-cluster/irsa-eso.tf` 가 db_mode=external 일 때만 연다.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-parameterstore
  namespace: default
  annotations:
    # ../apps 의 wave 1 패치는 그 폴더 리소스에만 붙는다 → 여기 직접 단다.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-2
