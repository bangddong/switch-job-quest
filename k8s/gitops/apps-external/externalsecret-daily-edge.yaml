# 📌D-016 B7-19 2단계 (2026-10-29) — Worker↔원본 공유 비밀(`EDGE_AUTH_SECRET`)을 **daily-api 에만** 준다.
#   EKS 에서 오늘의 질문(익명 explain·evaluate)은 daily-api 가 서빙한다(ingress `/api/v1/daily-question`). 그런데 daily-api 는
#   `core-api-runtime` 을 envFrom 하지 않는다 — 거기 있는 Anthropic·JWT·OAuth 키를 무로그인 서비스에 넘기지 않으려고
#   전용 Secret 을 따로 만든다(Blindspot B7-19-2 #1, 최소 권한).
#   정본 = SSM `/devquest/prod/app/EDGE_AUTH_SECRET`(`edge-auth-rotate.yml` 만 쓴다). IAM 은 이미 이 경로를 연다(irsa-eso).
#
#   🔑 `data`(키 지정)가 아니라 `find`(정확히 한 이름) — 파라미터가 **없으면 에러 없이 빈 Secret** 이 된다.
#      `data` 로 쓰면 파라미터 부재가 동기화 실패 → wave 1 Degraded → 창 전체가 멈춘다(B5-14). 이 키는 없어도
#      BE 가 기존 IP 판정으로 돌아가는 fail-soft 라(B7-19-2 설계) 창을 막을 이유가 없다.
#   ⚠️ 창이 켜진 채 교체하면 refreshInterval(1h)·envFrom 파드 미재시작 때문에 창 끝까지 옛 값 → BE 는 기존 판정(fail-soft).
#      그래서 `edge-auth-rotate.yml` 은 클러스터가 켜져 있으면 rotate 를 거부한다.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: daily-api-edge
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore
    kind: SecretStore
  target:
    name: daily-api-edge
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /devquest/prod/app/
        name:
          regexp: "^/devquest/prod/app/EDGE_AUTH_SECRET$"
      rewrite:
        - regexp:
            source: "^/devquest/prod/app/(.*)$"
            target: "$1"
