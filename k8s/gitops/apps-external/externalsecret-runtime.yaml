# 📌D-016 8-A (2026-10-21) — EKS 창 동안 core-api 가 쓰는 **외부 키**(Anthropic·Judge0·Resend·Grafana·Sentry).
#   Fly 에만 있던 값이라(Fly 시크릿 write-only) 사용자가 각 콘솔에서 다시 받아 SSM `/devquest/prod/app/<환경변수 이름>` 에
#   넣는다(TASK-17). 파라미터 이름 = 환경변수 이름이라 **경로째** 읽어 그대로 env 로 쓴다(키를 하나씩 나열하지 않는다 —
#   하나라도 없으면 ExternalSecret 전체가 실패해 wave 가 멈추는 B5-14 를 피한다).
#   IAM: `2-cluster/irsa-eso.tf` 가 db_mode=external 일 때 이 경로 **만** 연다(`/devquest/prod/db/*` 는 안 열린다).
#   🔴 0건이면(TASK-17 전) ESO 는 **에러 없이 빈 Secret** 을 만든다(QA F-1 — ESO 소스 확인). 반대로 IAM·KMS 오류로
#      **동기화가 실패**하면 이 ExternalSecret 이 wave 1 에서 Degraded 가 되어 이후 wave(core-api 포함)가 시작되지 않는다
#      (B5-14 와 같은 형태 — `optional: true` 는 Secret **부재**만 살린다, QA F-2). → 8-B on 잡이 둘 다 판정한다:
#      ExternalSecret Ready · `core-api-runtime` 키 개수 > 0 · 로그인 키 값(B7-16). 로그인 키 **부재**는 apply 전 워크플로 사전 점검.
#   ⚠️ 경로 `/devquest/prod/app/` 은 **세 곳 복제**다 — 여기 path·regexp·rewrite 와 `2-cluster/variables.tf`
#      `prod_app_parameter_prefix`(IAM). 바꿀 땐 함께(QA F-4).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: core-api-runtime
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore
    kind: SecretStore
  target:
    name: core-api-runtime
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /devquest/prod/app/
        # 🔴 regexp 는 **전체 경로**(`/devquest/prod/app/ANTHROPIC_API_KEY`)에 걸린다(ESO findByName 이 param.Name 으로 매칭 —
        #    QA 8-A F-1: `^[A-Z0-9_]+$` 는 맨 앞 `/` 때문에 0건 → **에러 없이 빈 Secret**, 앱 키가 조용히 안 들어갔다).
        #    **허용 목록**으로 좁힌다 — 같은 경로에 `JWT_SECRET`·`DB_PASSWORD` 같은 이름이 들어와도 envFrom 이 다른 Secret 을
        #    덮지 못하게(F-3). 키를 늘리려면 여기에 추가한다.
        #    GITHUB_CLIENT_{ID,SECRET}(B7-16, 10-28): core-api-app 이 external 모드에선 이 둘을 **안 갖는다**(secrets.tf) — 겹침 없음.
        name:
          regexp: "^/devquest/prod/app/(ANTHROPIC_API_KEY|JUDGE0_API_KEY|RESEND_API_KEY|GRAFANA_API_KEY|GRAFANA_LOKI_URL|GRAFANA_LOKI_INSTANCE_ID|SENTRY_DSN|GITHUB_CLIENT_ID|GITHUB_CLIENT_SECRET)$"
      rewrite:
        - regexp:
            source: "^/devquest/prod/app/(.*)$"
            target: "$1"
