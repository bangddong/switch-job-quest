# 📌D-016 B8-25 ⓐ (2026-11-02) — 창 동안 오늘의 질문 채점·꼬리질문 설명이 **실제 AI** 로 나가도록 ai-api 에 Anthropic 키를 준다.
#   EKS 에서 `/api/v1/daily-question` 은 daily-api 가 받고(ingress), daily-api 의 AI 는 ai-api(HTTP) 뿐이다. ai-api 는 base 에서
#   D-008 스텁이 켜져 있어 실사용자가 `[STUB]` 응답을 받았다(B8-25). 스텁 해제는 kustomization.yaml ⑩ 패치.
#   ai-api 는 `core-api-runtime` 을 envFrom 하지 않는다 — 거기 있는 JWT·OAuth·Judge0 키는 ai-api 가 쓰지 않는다(최소 권한).
#   정본 = SSM `/devquest/prod/app/ANTHROPIC_API_KEY`(**EKS 전용 별도 키**, core-api-runtime 과 같은 파라미터 — 사본이 아니라 같은 원천).
#   IAM 은 이미 이 경로를 연다(irsa-eso).
#
#   🔑 `find` — 파라미터가 **없으면 에러 없이 빈 Secret**(daily-api-edge 와 같은 이유, B5-14). `data` 로 쓰면 파라미터 부재가
#      동기화 실패 → wave 1 Degraded → 로그인까지 포함해 창 전체가 멈춘다.
#   🔴 대신 빈 Secret 은 **조용한 실패**다 — 스텁이 꺼진 ai-api 는 키 없이도 정상 기동하고(`${ANTHROPIC_API_KEY:}` 빈 기본값)
#      AI 호출 시점에야 실패한다(D-008 「더 나쁜 성질」). 그래서 on.sh 가 트래픽 전환 **전에** 이 Secret 의 키 이름을 검사해
#      없으면 창을 열지 않는다(「ai-api 실제 AI 키」 판정).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-api-anthropic
  namespace: default
  annotations:
    # ../apps 의 wave 1 패치는 그 폴더 리소스에만 붙는다 — 여기서 직접 단다(secretstore-parameterstore.yaml 주석)
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore
    kind: SecretStore
  target:
    name: ai-api-anthropic
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /devquest/prod/app/
        name:
          regexp: "^/devquest/prod/app/ANTHROPIC_API_KEY$"
      rewrite:
        - regexp:
            source: "^/devquest/prod/app/(.*)$"
            target: "$1"
