# 📌D-016 ⑥ B8-18 (2026-11-01) — daily-api 의 Grafana Cloud 송출 키(지표 OTLP + Loki)를 **daily-api 에만** 준다.
#   daily-api 는 `core-api-runtime` 을 envFrom 하지 않는다 — 거기 있는 Anthropic·JWT·OAuth 키를 무로그인 서비스에
#   넘기지 않으려고(최소 권한). `daily-api-edge` 에 얹지 않은 이유: 이름-내용이 어긋나고, 그 Secret 은 rotate 워크플로가
#   소유한 단일 키라는 서술(edge-auth-rotate.yml·secrets-map)이 깨진다(설계 docs/superpowers/plans/2026-10-30-observability.md).
#   정본 = SSM `/devquest/prod/app/GRAFANA_*`(core-api-runtime 과 **같은 파라미터** — 사본이 아니라 같은 원천을 두 Secret 이 읽는다).
#   IAM 은 이미 이 경로를 연다(irsa-eso).
#
#   🔑 `find` — 파라미터가 **없으면 에러 없이 빈 Secret**(daily-api-edge 와 같은 이유, B5-14). 키가 없으면 송출이 꺼질 뿐
#      창은 막지 않는다(OtlpMetricsConfig 의 자격증명 Condition·Loki appender 조건).
#   ⚠️ 허용 목록은 core-api-runtime regexp 의 GRAFANA_* 부분과 **같아야** 한다 — 한쪽만 바꾸면 daily-api 만 조용히 안 보낸다.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: daily-api-observability
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore
    kind: SecretStore
  target:
    name: daily-api-observability
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /devquest/prod/app/
        name:
          regexp: "^/devquest/prod/app/(GRAFANA_API_KEY|GRAFANA_LOKI_URL|GRAFANA_LOKI_INSTANCE_ID)$"
      rewrite:
        - regexp:
            source: "^/devquest/prod/app/(.*)$"
            target: "$1"
