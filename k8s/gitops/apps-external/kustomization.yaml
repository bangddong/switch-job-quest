# 📌D-016 순서표 5-B — **외부 DB(EC2 Postgres) 모드**의 ArgoCD 대상 폴더.
#
# `../apps`(in-cluster DB 모드)를 그대로 가져와 **DB 가 클러스터 밖에 있다는 차이만** 덮는다:
#   ① postgres 5종(StorageClass·PV·PVC·Service·StatefulSet)을 뺀다 — DB 는 1-network 의 EC2 다.
#   ② ExternalSecret `postgres-tls` 를 뺀다 — 그 원천(2-cluster `postgres_tls`)은 in-cluster 모드에만 있다.
#      남겨 두면 SecretSyncError → wave 1 이 Healthy 가 안 돼 **이후 wave 가 영원히 시작되지 않는다**(Blindspot B5-14).
#   ③ ExternalSecret `core-api-db` 의 원천을 바꾼다 — 좌표(host·dbname·username)는 Secrets Manager
#      `devquest-eks/db-connection`(2-cluster 가 db_mode=external 로 씀), 비밀번호는 SSM Parameter Store.
#      두 원천 합성은 Stage 2 `k8s/eso/externalsecret-db.yaml` 과 같은 모양이다.
#
#   ④ core-api 의 **기동 시 Flyway migrate 를 끈다**(QA 5-B F-1). 이 DB 는 prod 이고, 1a(#459)의 결정은
#      *"Fly `release_command` 가 유일한 migrate 실행자"* 다. EKS 는 **같은 main 커밋 이미지**를 쓰므로
#      스키마는 Fly 배포가 이미 맞춰 둔 상태다. 어긋나면 `ddl-auto: validate` 가 기동을 막는다(fail-closed —
#      EKS 가 prod 스키마를 바꾸는 것보다 안전). ⇒ external 모드에선 1b(마이그레이션 Job)가 필요 없다.
#      🔴 전제: EKS 이미지 태그 = Fly 가 배포한 커밋(순서표 2 정본 규칙). 태그 고정은 8번 전환 워크플로 몫이다 —
#         `../apps` 의 core-api 태그는 학습 세션 시절 값이 그대로 박혀 있다.
#
# 쓰는 법: ArgoCD Application 의 `path` 를 `k8s/gitops/apps` → `k8s/gitops/apps-external` 로(순서표 8 전환 워크플로).
#   2-cluster 는 `prod.auto.tfvars.json` 이 db_mode=external 을 자동으로 준다(8-A). 변수 기본값(in-cluster)은 그대로 — 튜토리얼 verify 마커(B5-15).
# ⚠️ Application 의 PV 패치(volumeHandle·AZ)는 대상이 없어져 아무것도 바꾸지 않는다(로컬 렌더로 확인 — 에러 아님).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../apps
  - secretstore-parameterstore.yaml
  - externalsecret-runtime.yaml   # 📌D-016 8-A — 앱 외부 키(TASK-17)
  - externalsecret-daily-edge.yaml # 📌D-016 B7-19 2단계 — Worker↔원본 공유 비밀, daily-api 전용
  - externalsecret-daily-observability.yaml # 📌D-016 ⑥ B8-18 — Grafana 송출 키, daily-api 전용
  - externalsecret-ai-api-anthropic.yaml # 📌D-016 B8-25 ⓐ — Anthropic 키, ai-api 전용
  - ingress.yaml                  # 📌D-016 8-B — prod 창 ALB(인증서는 Application 패치, off 는 Application 먼저)

patches:
  # ① ② — 삭제
  - patch: |-
      $patch: delete
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata: { name: gp3-static }
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolume
      metadata: { name: postgres-data }
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: { name: postgres-data, namespace: default }
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: postgres, namespace: default }
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: { name: postgres, namespace: default }
  - patch: |-
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: { name: postgres-tls, namespace: default }
  # ③ — core-api-db 원천 교체. CRD 라 strategic merge 가 아니라 JSON merge → `data` 목록이 **통째로** 바뀐다.
  - target: { group: external-secrets.io, kind: ExternalSecret, name: core-api-db }
    patch: |-
      - op: replace
        path: /spec/data
        value:
          - secretKey: DB_HOST
            remoteRef: { key: devquest-eks/db-connection, property: host }
          - secretKey: DB_NAME
            remoteRef: { key: devquest-eks/db-connection, property: dbname }
          - secretKey: DB_USERNAME
            remoteRef: { key: devquest-eks/db-connection, property: username }
          - secretKey: DB_PASSWORD
            sourceRef:
              storeRef: { name: aws-parameterstore, kind: SecretStore }
            remoteRef: { key: /devquest/prod/db/password }
  # ④ — core-api 기동 시 migrate 끔 (위 머리말). Fly 와 같은 환경변수 이름(be/fly.toml).
  - target: { kind: Deployment, name: core-api }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: DEVQUEST_FLYWAY_MIGRATE_ON_STARTUP, value: "false" }
      # ⑤ 📌D-016 8-A — Fly(be/fly.toml [env])와 같은 값. 없으면 `application.yml` 기본(localhost:5173)이라 FE 의
      #    POST 가 CORS 로 403 이 될 수 있다(B8-2).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: CORS_ALLOWED_ORIGINS, value: "https://quest.dhbang.co.kr" }
      # ⑥ 메일은 **Fly 만** 보낸다 — 창 중에도 Fly 1대가 살아 있고(9번 확정 10-30 — 0대 기각), 두 곳이 보내면 중복 발송이다(B8-19·U-5).
      #    기본값도 false 지만 명시한다(TASK-17 로 RESEND 키가 들어와도 EKS 는 보내지 않게).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: MAIL_ENABLED, value: "false" }
      # ⑦ 앱 외부 키(externalsecret-runtime.yaml). optional — Secret 이 **없을 때만** 파드를 살린다.
      #    ⚠️ ExternalSecret 동기화가 **실패**하면 wave 1 이 Degraded 라 core-api 자체가 안 만들어진다(QA F-2) —
      #    "실패해도 뜬다" 가 아니다. 판정은 8-B on 잡(ExternalSecret Ready · 키 개수 > 0 · 로그인 키 값 — B7-16) + 워크플로 사전 점검(로그인 키 부재).
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value: { secretRef: { name: core-api-runtime, optional: true } }
      # ⑨ 📌D-016 ⑥ B8-18 — 지표 공통 태그 `platform`·Loki 라벨 `platform`(be/support/monitoring·logging). Fly 는 be/fly.toml [env] 의 `fly`.
      #    ⚠️ 빈 문자열로 넣지 마라 — 미설정이면 `unknown` 기본값이지만, 빈 값은 그대로 빈 라벨이 된다.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: DEVQUEST_PLATFORM, value: "eks" }
  # ⑧ 📌D-016 B7-19 2단계 — daily-api 가 Worker 의 신뢰 IP 헤더를 검증할 공유 비밀(externalsecret-daily-edge.yaml).
  #    optional + 빈 Secret 허용 — 없으면 BE 가 기존 IP 판정으로 돌아간다(fail-soft). core-api 는 EKS 에서 오늘의 질문을
  #    받지 않으므로(ingress) 넣지 않는다.
  - target: { kind: Deployment, name: daily-api }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value: { secretRef: { name: daily-api-edge, optional: true } }
      # ⑨ 📌D-016 ⑥ B8-18 — daily-api 의 Grafana 송출(지표 job `devquest-daily-api` + Loki). 키는 전용 Secret(externalsecret-daily-observability.yaml),
      #    optional + 빈 Secret 허용 — 키가 없으면 송출만 꺼지고 파드는 뜬다. daily-api 는 Fly 에서 돌지 않으므로 platform 은 늘 `eks`.
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value: { secretRef: { name: daily-api-observability, optional: true } }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: DEVQUEST_PLATFORM, value: "eks" }
  # ⑩ 📌D-016 B8-25 ⓐ (2026-11-02) — 창 동안 ai-api 가 **실제 Anthropic** 을 부른다(D-008 의 「학습 클러스터」 전제가 prod 창엔 해당 없음).
  #    base(`k8s/base/ai-api.yaml`)의 스텁은 **그대로 둔다** — 학습·튜토리얼 경로(`../apps`)는 키가 없으므로 스텁이 맞다.
  #    D-008 반전 체크리스트는 base 플래그 **삭제**를 요구했지만, 이 overlay 만 prod 다(계획서 B8-25 행).
  - target: { kind: Deployment, name: ai-api }
    patch: |-
      # 스텁 끔 — `test` 로 이름을 확인한 뒤 값만 바꾼다. `env/-` 에 같은 이름을 덧붙이면 중복 env 가 되고,
      #   인덱스만 믿고 replace 하면 base 순서가 바뀌었을 때 엉뚱한 변수를 조용히 덮는다(이름이 다르면 렌더가 실패한다).
      - op: test
        path: /spec/template/spec/containers/0/env/1/name
        value: DEVQUEST_AI_STUB_TECH_INTERVIEW_ENABLED
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "false"
      # 키 — base 에 envFrom 이 **없어서** `envFrom/-` 가 아니라 목록째 add 한다(externalsecret-ai-api-anthropic.yaml).
      #   optional — Secret 이 없을 때만 파드를 살린다. 키 부재는 on.sh 가 트래픽 전환 전에 잡는다.
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - secretRef: { name: ai-api-anthropic, optional: true }
      # 메모리 — base 448Mi 는 **스텁 실측 + JVM 하한**(0.35L + Metaspace 160 + CodeCache 96 ≤ L → 393.8Mi, 여유 ≈35Mi)이다.
      #   실제 호출은 스텁이 한 번도 안 올린 Spring AI HTTP·TLS·응답 파싱 클래스를 로드한다 — Metaspace·네이티브가 는다(🟡).
      #   core-api(같은 Spring AI 를 inprocess 로 부르는 서비스)의 576Mi 에 맞춘다 → 힙 상한 ≈201Mi. 첫 창에서 working set 실측.
      #   requests 는 +64Mi 만 — 스케줄링 여유(노드 3대)를 크게 흔들지 않게.
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 576Mi
