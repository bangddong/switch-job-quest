# ESO 가 들어갈 네임스페이스 (Stage 5e).
#
# 왜 따로 만드나: Application 의 `CreateNamespace=true` 는 **destination 네임스페이스(default) 하나만**
# 만든다. ESO 차트는 `namespaceOverride` 로 `external-secrets` 에 들어가므로 그 네임스페이스는 누군가
# 먼저 만들어 둬야 한다. 손 경로에서는 `helm install --create-namespace` 가 이 일을 했다.
#
# 🔴 이름을 바꾸지 마라 — ESO IRSA 역할의 신뢰정책이 `system:serviceaccount:external-secrets:external-secrets`
#    만 허용한다(infra/aws-eks/2-cluster/irsa-eso.tf). 네임스페이스가 다르면 AssumeRole 이 거부된다.
#
# wave -1: ESO 차트(기본 wave 0)보다 먼저.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
