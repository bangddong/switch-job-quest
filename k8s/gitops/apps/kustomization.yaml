# ArgoCD 가 실제로 바라보는 폴더 (Stage 5c).
#
# 이 파일이 말하는 것: "앱 3종 + NetworkPolicy + HPA 를 묶고, 각 앱의 이미지를 이것으로 정한다."
#
# ── 이미지 주소를 둘로 쪼갠 이유 ─────────────────────────────────────────────
#   전체 주소 = <계정ID>.dkr.ecr.ap-northeast-2.amazonaws.com/devquest/<앱>:<태그>
#               └────────── 레지스트리 ──────────┘ └── 이름 ──┘ └ 태그 ┘
#   - 이름:태그  → **여기(git)** 에 둔다. "커밋하면 배포된다"가 되려면 태그가 git 에 있어야 한다.
#   - 레지스트리 → git 에 **두지 않는다.** AWS 계정 ID 가 들어 있고 이 레포는 공개다.
#                  클러스터에 등록하는 Application(../application.yaml)이 붙인다.
#   ⇒ 이 폴더만 렌더하면 이미지가 `devquest/core-api:<태그>` 로 나온다. 그대로는 못 받아온다
#     (docker.io 를 찾는다). **정상이다** — 레지스트리는 ArgoCD 가 붙인다.
#
# ── 왜 `images:` 가 아니라 패치인가 ─────────────────────────────────────────
#   base 의 세 파일이 전부 같은 글자 `IMAGE_PLACEHOLDER` 를 쓴다. Kustomize 의 `images:` 는
#   "이 이름을 가진 이미지를 전부 바꿔라"라서 세 앱을 구분하지 못한다. 그래서 Deployment 를
#   지정해 이미지를 통째로 바꾼다.
#
# 태그 바꾸는 법: 아래 `value:` 의 `:` 뒤를 ECR 에 **실제로 있는** 태그로 바꾸고 커밋한다.
#   aws ecr describe-images --repository-name devquest/daily-api --region ap-northeast-2 \
#     --query 'sort_by(imageDetails,&imagePushedAt)[].imageTags' --output json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace-external-secrets.yaml # Stage 5e — ESO 차트가 들어갈 자리
  - ../../eso # Stage 5e — SecretStore + ExternalSecret 3종 (RDS 용 제외)
  - ../../base # 앱 3종 + NetworkPolicy + postgres-static(5e 부터)
  - ../../hpa

# ── Stage 5e: 올리는 순서 (sync wave) ─────────────────────────────────────────
#   ArgoCD 는 번호가 작은 것부터 적용하고, **그 번호의 리소스가 전부 Healthy 가 된 뒤에** 다음 번호로 간다.
#   (Synced = "git 대로 적용했다" · Healthy = "실제로 쓸 수 있다". 순서 제어는 뒤쪽을 기다린다.)
#   ⚠️ 이 순서는 **Application 하나 안에서만** 보장된다. 그래서 ESO 차트도 같은 Application 에 넣었다.
#
#   -1  Namespace external-secrets          (namespace-external-secrets.yaml 안에 직접)
#    0  ESO 차트 전부                        (Application 의 helm source — 번호를 못 붙여 기본값 0)
#    1  SecretStore · ExternalSecret 3종     ← CRD(0) 가 있어야 만들 수 있다
#    2  postgres 5종                          ← Secret(1) 이 있어야 뜬다. 🔴 5종 전부 같은 번호(아래)
#    3  core-api                              ← Flyway 를 돌리는 유일한 앱. 빈 DB 면 먼저 떠야 한다
#    4  daily-api · ai-api · NetworkPolicy    ← daily-api 는 스키마 검증만 한다(ddl-auto: validate)
#    5  HPA                                   ← 지표를 읽기 전 ~30초 Degraded 로 보인다(5c). 앞에 두면 그동안 막힌다
#   Service 처럼 번호가 없는 것은 0 이다 — 먼저 생겨도 무해하다(가리킬 파드가 없을 뿐).
#
# 번호를 base 파일이 아니라 여기 붙이는 이유: 손 경로(sed | kubectl apply)는 순서를 사람이 정하므로
# 번호가 의미 없다. ArgoCD 경로의 사정은 ArgoCD 쪽 파일에 둔다.
patches:
  # wave 1 — 시크릿 참조. CRD 가 첫 sync 시점엔 아직 없어 dry-run 이 실패하므로 그 검사를 건너뛴다.
  - target: { group: external-secrets.io }
    patch: |-
      apiVersion: v1
      kind: not-important
      metadata:
        name: not-important
        annotations:
          argocd.argoproj.io/sync-wave: "1"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  # wave 2 — postgres 5종 (StorageClass gp3-static · PV/PVC postgres-data · Service/StatefulSet postgres)
  #   🔴 **같은 번호여야 한다.** gp3-static 은 WaitForFirstConsumer 라 파드가 스케줄돼야 PVC 가 묶인다.
  #      PVC 를 앞 번호에 두면 Pending(=Progressing)에서 기다리다 StatefulSet 차례가 영원히 안 온다.
  #   🔴 Prune=false — git 에서 빠져도 지우지 않는다(Application 에는 prune: true 가 켜져 있다).
  #      PV 는 Retain 이라 데이터는 남지만, PVC 가 지워지면 PV 가 claimRef 를 쥔 채 Released 로 남아
  #      다음 PVC 가 영원히 Pending 이다(실패 6종 ④). 그래서 5종 전부에 건다.
  #   🔴 Delete=false — Application 을 지워도(teardown) 남긴다. 지우는 것은 SOP 절차가 한다.
  - target: { name: "^(postgres|postgres-data|gp3-static)$" }
    patch: |-
      apiVersion: v1
      kind: not-important
      metadata:
        name: not-important
        annotations:
          argocd.argoproj.io/sync-wave: "2"
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
  - target: { kind: Deployment, name: core-api }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: not-important
        annotations:
          argocd.argoproj.io/sync-wave: "3"
  - target: { kind: Deployment, name: "^(daily-api|ai-api)$" }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: not-important
        annotations:
          argocd.argoproj.io/sync-wave: "4"
  - target: { kind: NetworkPolicy }
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: not-important
        annotations:
          argocd.argoproj.io/sync-wave: "4"
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: not-important
        annotations:
          argocd.argoproj.io/sync-wave: "5"

  # ── 이미지 (Stage 5c) ──
  - target: { kind: Deployment, name: core-api }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: devquest/core-api:1a8a9aac9249d3cd995ac4cb3822e37b46b2eab1
  - target: { kind: Deployment, name: ai-api }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: devquest/ai-api:14cb335e66670470e674f0eb76d62e84ee76e0e5
  - target: { kind: Deployment, name: daily-api }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: devquest/daily-api:14cb335e66670470e674f0eb76d62e84ee76e0e5
  # HPA 가 파드 수를 정하는 Deployment 는 git 에 replicas 를 적지 않는다.
  # 적어 두면 ArgoCD("git 은 1")와 HPA("최소 2")가 같은 칸을 번갈아 고쳐 쓴다 — 5c 세션에서 실제로 파드가 죽고 떴다.
  - target: { kind: Deployment, name: daily-api }
    patch: |-
      - op: remove
        path: /spec/replicas
