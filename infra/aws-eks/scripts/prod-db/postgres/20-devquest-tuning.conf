# 📌D-016 7-A (2026-10-21) — prod DB t4g.micro(메모리 904MB + swap 1GiB) 튜닝. install.sh 가 conf.d 에 둔다.
# 🔴 max_connections·shared_buffers 는 **재시작**이 필요하다. 전환(7-B) 뒤엔 재시작 = Fly·EKS 동시 장애 —
#    install.sh 는 reload 만 하고 "재시작 필요" 를 보고한다. 재시작은 사람이 창 밖에서(런북 「패치」).
#
# 커넥션 예산(B7-21): 50 − superuser 예약 3 = 47.
#   Fly 앱 10(maximum-pool-size) + release 머신 10(배포 순간만, 옛 머신과 겹침) = 20
#   → EKS(core-api·daily-api HPA)는 합쳐 **25 이하**로 10번 직전에 풀 상한을 정한다(지금 EKS 는 prod 를 안 쓴다).
# 백엔드 하나 ≈ 5~10MB. 100 이면 메모리를 넘어 OOM-killer 가 Postgres 를 죽인다(Fly·EKS 동시 장애).
max_connections = 50
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 32MB

# Fly 머신 suspend 로 끊긴 커넥션은 FIN 이 안 온다 — 기본(OS 7200s)이면 유령 세션이 슬롯을 2시간 쥔다(B7-22).
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6
# 🔴 idle_in_transaction_session_timeout 은 **설정하지 않는다**(QA 7-A F-1, HIGH). 이 결정을 내린 시점에는 CodingQuestService 의
#    generateProblem·submitCode 가 @Transactional 안에서 LLM·Judge0 를 순차 호출했다 — 60s 면 정상 요청의 세션이 끊겨 500 이 났다
#    (Neon 엔 이 제한이 없었다 → 전환 회귀). **그 서술은 B7-27(#516)에서 사실이 아니게 됐다**: 두 메서드의 @Transactional 을 걷었고
#    B7-21 ⓐ 에서 OSIV 도 껐다(외부 호출 대기 중 커넥션 active=0). 그래도 설정하지 않는 이유는 남아 있다 - 백업의 스냅샷 세션이
#    pg_dump 동안 idle in transaction 이다(F-2). 유령 세션은 위 keepalive 가 잡는다. (이 값을 켤지는 별도 결정 - 여기서 바꾸지 않았다.)
