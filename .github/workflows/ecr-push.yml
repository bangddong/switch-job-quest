name: ECR Push

# 앱 컨테이너 이미지를 빌드해 ECR에 푸시한다 (EKS 배포용).
#
# 왜 CI에서 빌드하나: 로컬 머신에서 prod 이미지를 만들면 "그 사람 노트북 상태"가 이미지에 섞인다.
#   CI는 매번 동일한 깨끗한 환경 + 감사 로그(누가/언제/어떤 커밋)가 남는다 = 실무 표준.
#
# ── 📌D-016 순서표 2 「이미지 공급망」 (2026-10-19) ─────────────────────────────
#   EKS 가 평일 창 동안 **prod 를 서빙**하게 되면서 규칙이 셋 바뀌었다 (계획서 N-10):
#
#   ① **ECR 에 들어가는 이미지 = main 커밋뿐.** main push 가 빌드·푸시하고, PR 은 빌드만 한다.
#      이전엔 PR 이 푸시했다 → *리뷰 전 이미지* 가 레포에 섞였고, 태그(`github.sha`)가
#      GitHub 이 만든 **일회성 머지 커밋**이라 `git show` 로 조회조차 안 됐다(원장 L-44).
#   ② **`latest` 를 만들지 않는다.** 배포는 언제나 40자 sha 태그. 레포는 IMMUTABLE
#      (`0-bootstrap/variables.tf` `ecr_image_tag_mutability`) — 태그가 한 번 붙으면 다른
#      이미지를 가리킬 수 없다. 그래서 *"같은 태그 재푸시"* 가 필요했던 `latest` 와는 공존 불가.
#   ③ **prod 태그 보존.** PR 이미지가 lifecycle 10개 한도를 채우던 경로가 닫힌다 → 남는 10개는
#      전부 main 이미지다. 지금 서빙 중인 태그가 만료되려면 그 뒤로 `be/**` main 머지가 10건 더
#      있어야 하고, 그 10건은 각자 자기 이미지를 갖는다.
#
#   ⚠️ **main HEAD 에 항상 이미지가 있는 것은 아니다.** `paths` 필터 때문에 문서만 바뀐 머지는
#      빌드하지 않는다. 배포할 태그는 *"`be/**`·이 파일을 마지막으로 바꾼 main 커밋"* 이다:
#        git log -1 --format=%H origin/main -- be .github/workflows/ecr-push.yml
#      (전환 워크플로 = 순서표 8 이 이 규칙으로 태그를 고른다.)
#
#   ⚠️ Fly(`be-cd.yml`)는 같은 커밋을 **따로** 빌드한다 — 바이트가 같은 이미지는 아니지만 소스·
#      마이그레이션 집합은 같다. 이미지 하나로 합치는 것은 이 범위 밖이다.

# ⚠️ GitHub 제약: workflow_dispatch는 **기본 브랜치(main)에 이 파일이 있을 때만** 실행 가능하다.
#    그리고 OIDC 신뢰정책(0-bootstrap/iam-github-oidc.tf)은 sub 이 `refs/heads/main` 또는
#    `pull_request` 인 토큰만 받는다 → 푸시 잡은 main 에서만 돈다(아래 `if:` 가 명시).
on:
  push:
    branches: [main]
    paths:
      - "be/**"
      - ".github/workflows/ecr-push.yml"
  # 수동 재빌드 — lifecycle 로 만료된 main 이미지를 다시 굽거나, 푸시가 실패한 run 을 대신할 때.
  # 이미 있는 태그면 아무것도 하지 않는다(IMMUTABLE — 아래 「태그 존재 확인」).
  workflow_dispatch:
    inputs:
      service:
        description: "빌드할 서비스"
        required: true
        default: core-api
        type: choice
        options: [core-api, ai-api, daily-api]
  # PR 은 **빌드만** 한다 — Dockerfile 이 깨졌는지(jar 글롭·SERVICE 인자) 머지 전에 안다.
  # AWS 자격증명을 쓰지 않으므로 PR 컨텍스트에서 OIDC 역할을 assume 하는 경로가 이 워크플로에서 사라진다.
  pull_request:
    paths:
      - "be/**"
      - ".github/workflows/ecr-push.yml"

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  build-check:
    name: Build check (${{ matrix.service }})
    if: github.event_name == 'pull_request'
    # EKS 노드가 arm64(Graviton, AL2023_ARM_64_STANDARD)라 arm64 러너에서 네이티브 빌드한다.
    # x86 러너 + QEMU 에뮬레이션은 Gradle/JVM 빌드에서 몇 배 느려진다.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        service: [core-api, ai-api, daily-api]
    steps:
      - uses: actions/checkout@v7
      - name: 이미지 빌드 (푸시 안 함)
        run: |
          set -euo pipefail
          docker build --build-arg SERVICE="${{ matrix.service }}" -f be/Dockerfile be

  build-push:
    name: Build & Push (${{ matrix.service }})
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write # OIDC로 AWS 역할 assume — 이 잡만
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # push = 세 서비스 전부, dispatch = 고른 하나.
        service: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.service) || '["core-api","ai-api","daily-api"]') }}
    # 🔴 그룹 키에 **sha 와 서비스**가 둘 다 들어가야 한다.
    #   `cancel-in-progress: false` 는 실행 중인 run 을 지키는 대신 **대기 중인 run 을 새 run 으로
    #   교체**한다. 키가 ref 뿐이면 연달아 들어온 run 이 조용히 `cancelled` 된다 — `failure` 가 아니라
    #   빨간불도 안 뜬다(2026-08-31 실측: run 33361787944, job 0개·8초).
    #   main 커밋마다 이미지가 있어야 롤백 대상이 생기므로 서로 다른 sha 는 병렬로 돈다.
    #   같은 sha·서비스(push 와 dispatch 가 겹칠 때)만 직렬화 → 뒤엣것은 「태그 존재 확인」에서 건너뛴다.
    concurrency:
      group: ecr-push-${{ github.sha }}-${{ matrix.service }}
      cancel-in-progress: false
    env:
      SERVICE: ${{ matrix.service }}
      SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 🔴 계정 ID 마스킹 — 이 레포는 퍼블릭이고 Actions 로그·요약도 퍼블릭이다.
      #    ECR 레지스트리 호스트가 `<계정ID>.dkr.ecr.<region>.amazonaws.com` 형태라
      #    이미지 주소를 찍는 것만으로 계정 ID 가 나간다. 근거·상세는 `infra-deploy.yml` 의 같은 스텝.
      - name: 계정 ID 마스킹
        shell: bash
        run: |
          ACCT="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$ACCT"
          # 🔴 **여기서 크게 실패해야 한다.** 빈 값이면 아래 치환이 아무것도 안 바꾸고
          #    **조용히 통과**한다(fail-open) — 계정 ID 가 그대로 로그에 찍힌다.
          #    (로컬 반증으로 확인: AWS_ACCOUNT_ID="" 이면 치환 0건, 종료코드 0)
          if [[ ! "$ACCT" =~ ^[0-9]{12}$ ]]; then
            echo "::error::계정 ID 조회 실패 — 마스킹 없이 진행할 수 없다 (길이/형식 불일치)"
            exit 1
          fi
          echo "AWS_ACCOUNT_ID=$ACCT" >> "$GITHUB_ENV"

      # IMMUTABLE 레포에 같은 태그를 다시 올리면 `ImageTagAlreadyExistsException` 으로 실패한다.
      # 재실행·dispatch 가 빨개지지 않게 **이미 있으면 건너뛴다**.
      # 🔴 "없음"은 `ImageNotFoundException` 일 때**만**이다. 그 외 에러(권한·네트워크·레포 없음)를
      #    "없음"으로 읽으면 빌드로 넘어가 push 에서야 다른 이유로 죽거나, 더 나쁘게는 조회 실패를
      #    부재로 착각한다 — 이 레포가 반복해서 데인 *"부재가 성공과 똑같이 생긴 실패"* 다.
      - name: 태그 존재 확인
        id: exists
        shell: bash
        run: |
          set -uo pipefail
          if OUT=$(aws ecr describe-images --repository-name "devquest/$SERVICE" \
                     --image-ids imageTag="$SHA" --query 'imageDetails[0].imageDigest' --output text 2>&1); then
            echo "::notice::devquest/$SERVICE:$SHA 이미 있음 ($OUT) — 건너뜀"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'ImageNotFoundException' <<<"$OUT"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::태그 조회 실패 — 없음과 구분할 수 없어 멈춘다: $OUT"
            exit 1
          fi

      - name: ECR 로그인
        if: steps.exists.outputs.skip == 'false'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 & 푸시
        if: steps.exists.outputs.skip == 'false'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/devquest/$SERVICE"
          # 태그는 sha 하나뿐이다. `latest` 를 다시 넣지 마라 — IMMUTABLE 레포에선 두 번째 푸시부터 실패한다.
          docker build --build-arg SERVICE="$SERVICE" -t "$IMAGE:$SHA" -f be/Dockerfile be
          docker push "$IMAGE:$SHA"

      - name: 배포용 이미지 주소 출력
        shell: bash
        run: |
          set -euo pipefail
          # ⚪ **미확인 전제**: Step Summary 는 `::add-mask::` 대상이 아니라고 보고 계정 ID 를 아예 쓰지 않는다.
          {
            echo "### devquest/$SERVICE :ship:"
            echo ""
            if [ "${{ steps.exists.outputs.skip }}" = "true" ]; then
              echo "이미 있는 태그 — 빌드 건너뜀"
            else
              echo "푸시 완료"
            fi
            echo ""
            echo '`<account>.dkr.ecr.'"$AWS_REGION"'.amazonaws.com/devquest/'"$SERVICE:$SHA"'`'
            echo ""
            echo "> \`<account>\` 자리의 실제 값은 로컬에서 얻으세요 — 퍼블릭 레포라 여기 찍지 않습니다:"
            echo "> \`tofu -chdir=infra/aws-eks/0-bootstrap output -json ecr_repository_urls\`"
          } >> "$GITHUB_STEP_SUMMARY"
