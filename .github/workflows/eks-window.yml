name: EKS Window

# 📌D-016 순서표 8-B — prod 평일 창의 EKS 를 켜고 끈다. **트래픽 전환은 없다**(8-C 몫): 켜서 ALB 를 직접 찔러 보고 끈다.
#   Q-3(2026-10-16): 켜기 = **수동만**(이 화면의 Run workflow 또는 `gh workflow run eks-window.yml -f action=on`)
#                    끄기 = 18:00 KST 자동 + 수동 off 언제든
#   + 매시 watchdog = CI 클러스터의 dead man's switch(B4-1). 로컬 리퍼는 맥이 깨어 있을 때만 돌고 CI·원격 클러스터를 못 본다.
#
# 🔑 자동 off·watchdog 의 **주 경로는 AWS EventBridge** 다(B4-21, 2026-10-23 — `0-bootstrap/eks-window-dispatch.tf`).
#    예약 규칙이 정시에 이 워크플로를 workflow_dispatch 로 부른다(action=off · action=watchdog).
#    계기 = 10-22 실측: GitHub cron 18:00 off 슬롯 **5시간 24분 지연**, 매시 watchdog **10슬롯 중 1개만 생성**.
#    dispatch 는 수 초 안에 시작됐다. 아래 GitHub schedule 은 **watchdog 보조만** 남겼다.
#
# 🔴 이 파일은 2-cluster 를 apply·destroy 하는 **유일한** 워크플로다 — Infra CI 의 guard-local-layers 가 그걸 강제한다(N-3).
#    트리거에 push·pull_request 를 넣지 마라: 머지 한 번이 컨트롤플레인을 띄운다(그 guard 가 막는다).
#
# 💰 on 한 번 = apply ~10분 + 설치·sync ~10분 + 창 시간. 시간당 ≈ $0.25(+LCU). 예산 게이트가 잔여 크레딧으로 거부할 수 있다.
# ⚠️ GitHub cron 은 UTC·지연·누락이 있고 레포 활동이 60일 없으면 schedule 이 꺼진다(N-13). 그래서 보조다.
#    ⚠️ EventBridge 경로도 **GitHub Actions 장애에는 함께 걸린다**(dispatch 는 받아도 run 이 안 돌 수 있다) —
#    B4-21 은 cron 지연·60일 비활성만 해소했다. dispatch 실패(401·422 등)는 CloudWatch 알람이 메일로 알린다.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "on = 켜기(트래픽은 Fly 그대로) · off = 끄기 · watchdog = 임대 없거나 만료일 때만 끄기(EventBridge 매시)"
        type: choice
        # 🔴 따옴표 필수 — 맨 on/off 는 GitHub 의 입력 검증기가 YAML 1.1 불리언(true/false)으로 읽는다(2026-10-22 실측:
        #    `-f action=on` → HTTP 422 "not in the list of allowed values", `-f action=true` 는 통과하고 두 잡 다 skipped).
        #    actionlint(YAML 1.2)는 못 잡는다. 아래 `needs: "on"` 도 같은 이유.
        options: ["on", "off", "watchdog"]
        # 🔴 기본값은 "off" — 이 입력을 이제 **AWS 가 기계적으로** 넣는다. EventBridge input 의 키를 잘못 쓰면
        #    (`inputs` 오타 등) 기본값이 적용되는데, "on" 이면 매시 클러스터를 켜고 6시간 임대까지 써서 watchdog 도 못 끈다
        #    (Blindspot U1). 실수의 방향을 **켜기 → 끄기** 로 돌린다. 켜기는 Q-3 대로 사람이 명시적으로 고른다.
        default: "off"
      hours:
        description: "임대 시간(1~10, on 에서만). 지나면 매시 watchdog 이 끈다. 18:00 KST off 는 이와 무관하게 돈다"
        type: string
        default: "6"
  schedule:
    # 🔴 18:00 off(`0 9 * * *`)는 **지웠다** — EventBridge 가 정시에 부른다. GitHub 판은 늦게 오면 해롭다:
    #    5시간 늦은 schedule off 는 force 라 **18:00 이후 사람이 정당하게 켠 창을 끈다**(Blindspot U4). watchdog 은 임대를
    #    존중하므로 늦게 와도 안전하다 → 그것만 보조로 남긴다. ⚠️ infra-ci guard 가 트리거 키 `schedule workflow_dispatch`
    #    를 요구한다 — 이 줄까지 지우면 guard 도 함께 고쳐야 한다.
    # ⚠️ :47 — EventBridge watchdog(:17)과 **반 시간 어긋낸다**. 같은 분이면 같은 concurrency 대기 슬롯을 두고 서로·18:00 off 를
    #    취소시킬 확률만 키운다(QA F-4). 어긋나면 보조가 "다른 시각의 두 번째 기회" 가 된다.
    - cron: "47 * * * *"  # 매시 watchdog(보조) — 클러스터가 있는데 임대가 없거나 만료면 off. 정시는 GitHub 혼잡 시간이라 피했다

# 🔑 그룹 하나 — on·off·watchdog 이 동시에 돌면 같은 state 를 두고 락을 다툰다(B4-11).
#   ⚠️ GitHub concurrency 는 **대기 중인 실행을 새 실행이 취소한다**(B8-15). 그래서 취소돼도 되게 설계했다:
#     · 대기 중 off 가 새 on 에 밀려 취소 → on 이 새 임대를 쓴다. 그 임대가 끝나면 watchdog 이 끈다.
#     · 대기 중 watchdog 이 off 에 밀려 취소 → off 가 watchdog 의 상위 집합이다.
#     · 대기 중 on 이 off·watchdog 에 밀려 취소 → 켜지지 않는다(cancelled 로 보인다). 다시 누르면 된다.
#     · 🔴 대기 중 **수동 off·18:00 off 가 뒤에 온 watchdog 에 밀려 취소**(QA F-2) → 그 watchdog 은 임대가 유효하면 skip 한다.
#       명시적 off 가 조용히 사라지는 유일한 경우다. 상한은 같다(임대 만료 + 1h). off 를 눌렀으면 cancelled 가 아닌지 한 번 본다.
#       ⚠️ watchdog 이 EventBridge(:17) + GitHub 보조(:47)로 두 배라 이 경로가 전보다 잦다. 예: on 이 17:57~18:00 에 시작해
#       18:17 까지 도는 동안 18:00 off 가 대기 → 18:17 watchdog 에 밀려 취소. 그래도 임대 만료 뒤 watchdog 이 끈다.
#   즉 **"취소된 off" 의 비용 상한 = 임대 시간 + 1시간**이다. 진행 중 실행은 취소하지 않는다(state 꼬임).
#   ⚠️ 이 상한은 **watchdog 이 매시 실제로 돌 때만** 참이다 — GitHub cron 만 있던 10-22 엔 거짓이었다(10슬롯 중 1개).
#      EventBridge 경로가 생긴 뒤에야 성립한다.
concurrency:
  group: eks-window
  cancel-in-progress: false

permissions:
  id-token: write # main 전용 역할 assume
  contents: read
  actions: read   # pick-image-tag.sh 가 be-cd 실행 이력을 읽는다

env:
  AWS_REGION: ap-northeast-2
  TOFU_VERSION: 1.12.4 # 🔴 로컬과 같게(B4-10). infra-deploy 의 1.8.5 와 다르다 — 2-cluster state 는 로컬·이 워크플로가 함께 쓴다

jobs:
  on:
    name: EKS Window / on
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 50 # OIDC 세션 1h 안(B8-9). 실패하면 off 잡이 새 세션으로 정리한다
    outputs:
      leased: ${{ steps.lease.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # pick-image-tag.sh 가 be/ 트리 해시를 비교한다

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false # `tofu output -raw` 를 그대로 쓴다(래퍼가 stdout 을 꾸민다)

      - name: main 역할 시크릿 존재 확인
        env:
          MAIN_ROLE: ${{ secrets.AWS_ROLE_ARN_MAIN }}
        run: |
          [ -n "$MAIN_ROLE" ] || { echo "::error::secrets.AWS_ROLE_ARN_MAIN 이 비어 있다"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_MAIN }}
          aws-region: ap-northeast-2

      # 🔴 계정 ID 마스킹 — 퍼블릭 레포의 Actions 로그·요약은 퍼블릭이다(infra-deploy.yml 과 같은 이유·같은 fail-closed, B4-9).
      #    apply 로그의 리소스 id(ARN)·helm·kubectl 에러가 계정 ID 를 담는다.
      - name: 계정 ID 마스킹
        shell: bash
        run: |
          ACCT="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$ACCT"
          [[ "$ACCT" =~ ^[0-9]{12}$ ]] || { echo "::error::계정 ID 조회 실패 — 마스킹 없이 진행할 수 없다"; exit 1; }
          echo "AWS_ACCOUNT_ID=$ACCT" >> "$GITHUB_ENV"

      - name: 입력 확인 · 이른 시각 경고
        shell: bash
        env:
          HOURS: ${{ inputs.hours }}
        run: |
          [[ "$HOURS" =~ ^([1-9]|10)$ ]] || { echo "::error::hours 는 1~10 정수 ($HOURS)"; exit 1; }
          H=$(TZ=Asia/Seoul date +%-H)
          echo "KST $(TZ=Asia/Seoul date '+%m-%d %H:%M') · 임대 ${HOURS}h"
          # Q-3 — 켜는 시각이 비용을 정한다. 창 기본안은 12~18 KST
          [ "$H" -ge 12 ] || echo "::warning::12:00 KST 이전 on — 창 기본안(12~18)보다 이르다. 18:00 off 까지 비용이 그만큼 는다"
          [ "$H" -lt 18 ] || echo "::warning::18:00 KST 이후 on — 18:00 off(EventBridge)가 지났으니 임대(${HOURS}h) 만료 후 watchdog 이 끈다"
          M=$(TZ=Asia/Seoul date +%-M)
          # QA F-3 — on 이 끝나기까지 ~20분: 17:35 이후면 대기 중이던 18:00 off 가 켜자마자 닫는다
          if [ "$H" -eq 17 ] && [ "$M" -ge 35 ]; then echo "::warning::17:35 이후 on — 켜지는 즈음 18:00 off(EventBridge)가 바로 끈다. 18:00 이후에 다시 켜는 편이 낫다"; fi
          # QA F-3 — 09:00 을 가로지르면 EKS core-api 의 09:00 스케줄러(오늘 질문 생성)가 Fly 와 함께 돈다(메일은 EKS 에서 꺼짐 — 9번)
          [ "$H" -ge 9 ] || echo "::warning::09:00 KST 이전 on — 09:00 스케줄러가 Fly·EKS 양쪽에서 돈다(같은 커밋이라 동치로 판단, 9번에서 정리)"

      - name: 예산 게이트 (Q-3 · B8-22)
        shell: bash
        run: |
          set -euo pipefail
          MSG=$(bash infra/aws-eks/scripts/prod-window/budget-gate.sh "${{ inputs.hours }}")
          echo "- 💰 $MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: 이미지 태그 (= Fly 가 돌리는 커밋, 8-A)
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(bash infra/aws-eks/scripts/prod-window/pick-image-tag.sh "$GITHUB_REPOSITORY")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "- 이미지 \`$TAG\` · 매니페스트 리비전 \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      # 🔴 apply **전에** 쓴다 — apply 도중 실패해도 off 잡·watchdog 이 "이 실행이 켜려던 클러스터" 를 정리할 근거가 된다.
      - name: 임대 쓰기
        id: lease
        shell: bash
        run: |
          set -euo pipefail
          . infra/aws-eks/scripts/prod-window/common.sh
          win_lease_put "${{ inputs.hours }}"

      - name: tofu init
        working-directory: infra/aws-eks/2-cluster
        run: tofu init -input=false

      # prod.auto.tfvars.json(db_mode=external · environment=prod · 노드 3)을 tofu 가 자동으로 읽는다 — -var 가 없다(8-A, B8-5·B8-21).
      # 🔴 `sed -u` — 버퍼링하면 과금 중 진행이 안 보인다(infra-deploy.yml QA F-1).
      - name: tofu apply (💰 과금 시작)
        working-directory: infra/aws-eks/2-cluster
        shell: bash
        run: |
          set -euo pipefail
          tofu apply -auto-approve -input=false -no-color -lock-timeout=10m 2>&1 \
            | sed -u "s/${AWS_ACCOUNT_ID:-__unset__}/<account>/g"

      - name: 설치 · sync · 스모크 (트래픽 전환 없음)
        shell: bash
        run: |
          set -euo pipefail
          bash infra/aws-eks/scripts/prod-window/on.sh "${{ steps.tag.outputs.tag }}" "$GITHUB_SHA" 2>&1 \
            | sed -u "s/${AWS_ACCOUNT_ID:-__unset__}/<account>/g"
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then sed -i "s/${AWS_ACCOUNT_ID}/<account>/g" "$GITHUB_STEP_SUMMARY"; fi

  off:
    name: EKS Window / off
    needs: "on"
    # schedule·off·watchdog dispatch — 그리고 **on 이 임대를 쓴 뒤 실패**하면 같은 실행에서 끈다(8-B 는 트래픽 0 이라 즉시 끄는 게 안전).
    if: >-
      always() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'off') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'watchdog') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'on' && needs.on.result != 'success' && needs.on.outputs.leased == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: main 역할 시크릿 존재 확인
        env:
          MAIN_ROLE: ${{ secrets.AWS_ROLE_ARN_MAIN }}
        run: |
          [ -n "$MAIN_ROLE" ] || { echo "::error::secrets.AWS_ROLE_ARN_MAIN 이 비어 있다"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_MAIN }}
          aws-region: ap-northeast-2

      - name: 계정 ID 마스킹
        shell: bash
        run: |
          ACCT="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$ACCT"
          [[ "$ACCT" =~ ^[0-9]{12}$ ]] || { echo "::error::계정 ID 조회 실패 — 마스킹 없이 진행할 수 없다"; exit 1; }
          echo "AWS_ACCOUNT_ID=$ACCT" >> "$GITHUB_ENV"

      - name: 끌지 판정
        id: decide
        shell: bash
        env:
          # watchdog = 매시 cron(보조) 또는 dispatch action=watchdog(EventBridge 매시). off(EventBridge 18:00·수동)·on 실패 = force
          # 🔴 dispatch watchdog 을 여기 빠뜨리면 force 로 떨어져 **창 중에도 매시 클러스터를 끈다**.
          MODE: ${{ ((github.event_name == 'schedule' && github.event.schedule == '47 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.action == 'watchdog')) && 'watchdog' || 'force' }}
        run: |
          set -uo pipefail
          OUT=$(bash infra/aws-eks/scripts/prod-window/decide-off.sh "$MODE"); rc=$?
          echo "모드 $MODE → ${OUT:-없음} (rc $rc)"
          echo "act=$([ "$OUT" = act ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit $rc

      # off 착수 = 임대 즉시 만료 — 이 실행이 중간에 죽어도 다음 watchdog 이 바로 다시 끈다(common.sh win_lease_expire)
      - name: 임대 만료 표시
        if: steps.decide.outputs.act == 'true'
        shell: bash
        # best-effort — 실패해도 off 를 멈추지 않는다(QA F-1). 끝까지 성공하면 off-verify 가 임대를 지운다
        run: |
          . infra/aws-eks/scripts/prod-window/common.sh
          win_lease_expire || echo "::warning::임대 만료 표시 실패 — off 는 계속한다. 이 off 가 실패하면 watchdog 재시도는 임대 만료 뒤다"

      - name: Application·Ingress 정리 · LB 0 확인 (destroy 전)
        if: steps.decide.outputs.act == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash infra/aws-eks/scripts/prod-window/off-pre.sh 2>&1 | sed -u "s/${AWS_ACCOUNT_ID:-__unset__}/<account>/g"

      - name: tofu init
        if: steps.decide.outputs.act == 'true'
        working-directory: infra/aws-eks/2-cluster
        run: tofu init -input=false

      - name: tofu destroy (💰 과금 종료)
        if: steps.decide.outputs.act == 'true'
        working-directory: infra/aws-eks/2-cluster
        shell: bash
        run: |
          set -euo pipefail
          tofu destroy -auto-approve -input=false -no-color -lock-timeout=10m 2>&1 \
            | sed -u "s/${AWS_ACCOUNT_ID:-__unset__}/<account>/g"

      # "destroy 를 쳤다" 가 아니라 AWS 의 답으로 끝을 판정한다(SOP §8b). 실패하면 임대를 남겨 watchdog 이 다시 돈다.
      - name: 꺼짐 판정 · 임대 삭제
        if: steps.decide.outputs.act == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash infra/aws-eks/scripts/prod-window/off-verify.sh 2>&1 | sed -u "s/${AWS_ACCOUNT_ID:-__unset__}/<account>/g"
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then sed -i "s/${AWS_ACCOUNT_ID}/<account>/g" "$GITHUB_STEP_SUMMARY"; fi
