name: Job Secret Rotate

# 09:00 일일 작업 트리거 비밀 `DEVQUEST_JOB_SECRET` (Fly 유휴 suspend 전환, 2026-11-02).
#   Fly 머신이 유휴 시 자면 core-api 의 @Scheduled 가 안 돌므로, Cloudflare Worker Cron 이 매일 09:00 KST 에
#   `POST https://api.quest.dhbang.co.kr/internal/jobs/daily` + 헤더 `X-DevQuest-Job-Auth: <비밀>` 로 깨운다.
#   BE(DailyJobController)는 이 비밀을 상수 시간 비교하고, 서버 비밀이 비어 있으면 항상 503 `disabled`(fail-closed)로 거부한다.
#
#   사본 2곳 — ① Worker secret `DEVQUEST_JOB_SECRET`(Cloudflare, devquest-fe) ② Fly secret(devquest-api)
#   🔑 **edge-auth-rotate 와 다른 값이다** — edge 비밀은 Worker 가 `/api/*` 모든 요청에 붙이므로 재사용하면 누구나 메일을 트리거할 수 있다.
#   🔑 **SSM·EKS 사본은 없다** — EKS 는 이 작업을 하지 않는다(EKS core-api 는 비밀이 없어 영구히 503 disabled, 의도된 동작).
#
#   🔴 edge 와 반대로 **fail-closed** — 두 사본이 없거나 서로 다르면 요청이 거부되어 **메일이 안 나간다**(조용히 안전한 쪽으로 멈춘다).
#      그래서 순서는 Worker → Fly 이고, 중간 실패 시 무엇이 어긋나는지 아래에 적는다.
#        - Worker 쓰기에서 실패: 아무것도 안 바뀌었다(옛 값 그대로 정상). 다시 돌리면 된다.
#        - Worker 성공 → Fly 실패: Worker 만 새 값 → 다음 09:00 Worker 요청이 401(Fly 비밀이 옛 값·없음이면 503) 이 된다.
#          **메일이 안 나간다.** rotate 를 다시 돌려 둘을 새로 맞춘다(09:00 직전·직후 교체는 피한다).
#        - Fly 재시작(≈30초 다운, 이후 resume/cold start)은 `secrets import` 의 부작용이다.
#
#   action=check  — 이름만 본다(값 X): Fly secret 목록 · Worker secret 목록 + 헤더 없는 POST 프로브(401 이면 Fly 에 비밀이 있다).
#                    ⚠️ 두 값이 **같은지**는 못 본다(Worker secret 은 읽을 수 없고 digest 도 없다 — edge 와 같은 한계).
#                    프로브는 비밀 존재 여부(401 vs 503)만 말한다. 어긋남이 의심되면 rotate 를 다시 돌려 둘을 새로 맞춘다.
#   action=rotate — 새 값 64자 → Worker → Fly(재시작). confirm `FLY-RESTART`.
#
#   🔑 값은 러너 밖으로 나가지 않는다 — 생성 즉시 ::add-mask::, Worker·Fly 는 stdin. 로그에 출력하지 않는다.
#   🔴 main 에서만(`AWS_ROLE_ARN_MAIN` 신뢰 정책 — 클러스터 존재 조회에 AWS 자격증명이 필요하다). job 에 `environment:` 를 넣지 마라(B3-10).
#   🔴 EKS 클러스터가 켜져 있으면 rotate 거부 — EKS 창 중에는 Fly 배포·재시작을 건드리지 않는다(edge-auth-rotate 와 같은 가드).
#   🔴 be-cd 실행·대기 중이면 거부 — 같은 Fly 앱에 배포와 secret 변경이 겹치지 않게(edge-auth-rotate·jwt-rotate 와 같은 이유).
#   ⚠️ 엔드포인트가 배포된 뒤에 돌린다 — 배포 전 이미지에는 `/internal/jobs/daily` 가 없어 마지막 프로브가 401 이 아닌 값으로 실패한다.
#   ⚠️ 프로브는 헤더 **없이** 보낸다. 헤더를 붙이면 실제 작업(질문 생성·메일 발송)이 돈다.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "check = 이름만 확인 · rotate = 새 값 → Worker + Fly (🔴 Fly 재시작 ≈30초)"
        type: choice
        options: ["check", "rotate"]
        default: "check"
      confirm:
        description: "rotate 일 때만 — 정확히 FLY-RESTART"
        type: string
        default: ""

permissions:
  id-token: write # main 전용 역할 assume
  contents: read
  actions: read   # be-cd 실행 중 여부

concurrency:
  group: job-secret-rotate
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  # wrangler(서드파티 npm 런타임)에 넘기지 않을 것 — AWS 정적 키 3종 + OIDC 토큰 재발급 수단 + Fly 토큰.
  #   남는 AWS_REGION·AWS_DEFAULT_REGION 은 자격증명이 아니다. CLOUDFLARE_* 는 wrangler 가 써야 하므로 남긴다.
  NO_AWS: env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u FLY_API_TOKEN
  FLY_APP: devquest-api
  SECRET_NAME: DEVQUEST_JOB_SECRET
  JOB_URL: https://api.quest.dhbang.co.kr/internal/jobs/daily

jobs:
  job:
    name: Job secret / ${{ inputs.action }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: 입력·시크릿 확인
        shell: bash
        env:
          MAIN_ROLE: ${{ secrets.AWS_ROLE_ARN_MAIN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ -n "$MAIN_ROLE" ] || { echo "::error::secrets.AWS_ROLE_ARN_MAIN 이 비어 있다"; exit 1; }
          [ -n "$FLY_API_TOKEN" ] || { echo "::error::secrets.FLY_API_TOKEN 이 비어 있다"; exit 1; }
          [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] || { echo "::error::Cloudflare 배포 토큰·계정 secret 이 비어 있다"; exit 1; }
          if [ "$ACTION" = rotate ] && [ "$CONFIRM" != FLY-RESTART ]; then
            echo "::error::rotate 는 confirm=FLY-RESTART 가 필요하다(Fly 머신 재시작)"; exit 1
          fi

      # 서드파티·가변 ref 라 AWS(Admin) 자격증명이 env 에 들어오기 **전에** 설치한다(jwt-rotate QA F-2)
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # wrangler 는 fe 의 package.json 에 고정된 버전을 쓴다(fe-cd 와 같다). Node >= 22.
      #   설치는 AWS 자격증명 전, **실행**은 뒤 스텝이라 실행 시 `$NO_AWS` 로 AWS 환경변수를 지운다.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fe/package-lock.json
      - run: npm ci
        working-directory: fe

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_MAIN }}
          aws-region: ap-northeast-2

      # 퍼블릭 레포의 Actions 로그는 퍼블릭이다 — 계정 ID 마스킹(fail-closed)
      - name: 계정 ID 마스킹
        shell: bash
        run: |
          ACCT="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$ACCT"
          [[ "$ACCT" =~ ^[0-9]{12}$ ]] || { echo "::error::계정 ID 조회 실패 — 마스킹 없이 진행할 수 없다"; exit 1; }

      - name: rotate 전제 — 클러스터 꺼짐 · be-cd 없음
        if: inputs.action == 'rotate'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . infra/aws-eks/scripts/prod-window/common.sh
          C=$(win_cluster_exists) || { echo "::error::클러스터 조회 실패 — 판단 불가라 멈춘다"; exit 1; }
          [ "$C" = no ] || { echo "::error::EKS 클러스터가 켜져 있다 — 창이 끝난 뒤(off 후) 돌린다"; exit 1; }
          N=0
          for s in in_progress queued waiting pending requested; do
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow be-cd.yml --status "$s" --json databaseId --jq length)
            N=$((N + n))
          done
          [ "$N" = 0 ] || { echo "::error::be-cd 가 $N 건 실행·대기 중 — 끝난 뒤 다시"; exit 1; }

      - name: rotate — 새 값 → Worker → Fly (🔴 Fly 재시작)
        id: rotate
        if: inputs.action == 'rotate'
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          KEY=$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 64 || true)
          [ "${#KEY}" -eq 64 ] || { echo "::error::값 생성 실패(길이 ${#KEY})"; exit 1; }
          echo "::add-mask::$KEY"
          F=$(mktemp); trap 'rm -f "$F"' EXIT
          printf '%s' "$KEY" > "$F"
          # ① Worker 먼저 — 여기서 실패하면 아무것도 안 바뀐 채 멈춘다(옛 값 그대로 정상). Worker 만 새 값인 구간은
          #    Fly 쓰기가 끝날 때까지고, 그 사이 Worker 요청은 401 로 거부된다(fail-closed — 메일이 나가지 않을 뿐 안전하다).
          #    secret put 은 새 Worker 버전을 즉시 배포한다(코드·라우트는 그대로).
          #    `env -u AWS_*` — wrangler(서드파티 npm 런타임)에 main 역할 자격증명을 넘기지 않는다.
          (cd fe && $NO_AWS npx wrangler secret put "$SECRET_NAME" < "$F" >/dev/null)
          echo "✅ Worker secret $SECRET_NAME 저장"
          # ② Fly — stdin 으로(인자 X). import 는 머신을 재시작한다. SSM·EKS 사본은 만들지 않는다(EKS 는 이 작업을 안 한다).
          #    이 스텝이 실패하면 Worker 만 새 값이다 → 헤더 주석대로 rotate 를 다시 돌려 맞춘다.
          printf '%s=%s\n' "$SECRET_NAME" "$KEY" | flyctl secrets import -a "$FLY_APP"
          echo "- 🔑 Job 비밀 교체: Worker → Fly import 완료(재시작)" >> "$GITHUB_STEP_SUMMARY"

      - name: 이름 확인 (값 X)
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACTION: ${{ inputs.action }}
        run: |
          set -uo pipefail
          FAIL=0
          if flyctl secrets list -a "$FLY_APP" --json | jq -e --arg n "$SECRET_NAME" '.[] | select((.Name // .name) == $n)' >/dev/null; then
            echo "✅ Fly $SECRET_NAME 있음"
          else
            echo "::warning::Fly $SECRET_NAME 없음 — 엔드포인트는 503 disabled(메일 트리거 꺼짐)"; FAIL=1
          fi
          # stdout 만 파싱하고 stderr 는 따로 받는다 — 경고 한 줄이 jq 입력에 섞이면 '없음' 오탐이 난다(edge QA F-8)
          WE=$(mktemp)
          if W=$(cd fe && $NO_AWS npx wrangler secret list --format json 2>"$WE"); then
            if printf '%s' "$W" | jq -e --arg n "$SECRET_NAME" '.[] | select(.name == $n)' >/dev/null 2>&1; then
              echo "✅ Worker $SECRET_NAME 있음"
            else
              echo "::warning::Worker $SECRET_NAME 없음(또는 출력 형태가 예상과 다름: ${W:0:200}) — Cron 이 헤더를 못 붙여 401"; FAIL=1
            fi
          else
            E=$(cat "$WE"); echo "::warning::Worker secret 목록 조회 실패: ${E:0:300}"; FAIL=1
          fi
          if [ "$ACTION" = rotate ] && [ "$FAIL" = 1 ]; then
            echo "::error::rotate 직후인데 사본이 빠졌다 — 위 경고 확인"; exit 1
          fi

      # always() — 위 이름 확인이 실패해도(쓰기는 이미 끝난 뒤) Fly 가 돌아왔고 비밀이 들어갔는지는 반드시 본다.
      #   단 rotate 는 **쓰기 단계가 성공했을 때만**(QA F-2) — 입력 오류·가드 거부(EKS 창·be-cd 중)로 쓰기를 건너뛰었으면
      #   Fly 를 깨우지 않는다(거부한 이유가 바로 Fly 를 건드리지 않기다). 쓰기가 중간 실패(Worker 만 새 값)면 프로브도 의미 없다.
      #   헤더 **없는** POST → 401 이어야 한다: 401 = 엔드포인트 존재 + 서버 비밀 설정됨(503 disabled 는 비밀 없음).
      #   Fly 가 자고 있거나 재시작 중일 수 있어 재시도한다(첫 요청이 resume·cold start 를 일으킨다). 401 외의 값은 전부 재시도 대상.
      #   헤더를 붙여 실제 작업을 돌리지 않는다(메일이 나간다).
      - name: 배포 확인 — 헤더 없는 POST 가 401 인가
        if: ${{ always() && ((inputs.action == 'rotate' && steps.rotate.outcome == 'success') || (inputs.action == 'check' && success())) }}
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
        run: |
          LAST=000
          for i in $(seq 1 30); do
            LAST=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$JOB_URL" || echo 000)
            echo "시도 $i: HTTP $LAST"
            [ "$LAST" = 401 ] && { echo "✅ 401 unauthorized — 엔드포인트가 있고 서버 비밀이 설정돼 있다 (+$((i * 10))s 이내)"; exit 0; }
            sleep 10
          done
          case "$LAST" in
            503) MSG="503 disabled — Fly 에 $SECRET_NAME 이 안 들어갔다" ;;
            404|403) MSG="$LAST — 엔드포인트가 아직 배포되지 않았다(be-cd 완료 후 다시)" ;;
            *) MSG="HTTP $LAST — Fly 가 5분 안에 기동하지 않았다(fly status 확인)" ;;
          esac
          if [ "$ACTION" = rotate ]; then
            echo "::error::$MSG"; exit 1
          fi
          echo "::warning::$MSG"
