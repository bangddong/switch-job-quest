name: FE CD

on:
  push:
    branches: [main]
    paths:
      - 'fe/**'
      - '.github/workflows/fe-cd.yml'   # 빌드 env 변경도 재배포돼야 반영된다

concurrency:
  group: fe-cd
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fe/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Vercel 제거: Workers 가 quest.dhbang.co.kr/* route 로 prod 를 서빙한다(V-3). 위 Vercel job 은 V-4 까지 복귀 경로로 유지한다.
  # 별도 job 이라 Workers 배포가 실패해도(예: secrets 미등록) 위 Vercel prod 배포는 막히지 않는다.
  deploy-workers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe

    steps:
      - uses: actions/checkout@v7

      # secrets 가 없으면 조용히 건너뛰지 않고 여기서 실패시킨다 (누락이 보여야 한다). npm ci·build 전에 점검해 빨리 실패한다.
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret 이 등록되지 않았습니다 (TASK-20)."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # wrangler 4.152 는 Node >= 22 를 요구한다 (위 Vercel job 의 Node 20 과 별개).
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fe/package-lock.json

      - run: npm ci

      # 🔴 Vite 는 VITE_* 를 **빌드 시점에** 번들에 박는다. Vercel 은 자기 env 로 넣어 줬지만 이 job 은 받지 않아서
      #    V-3(10-26) 이후 prod 번들이 `client_id=undefined` → GitHub 로그인 404 였다(2026-10-28 발견).
      #    client id 는 비밀이 아니다(로그인 URL 에 그대로 노출) — 그래서 secret 이 아니라 여기 평문으로 둔다.
      #    값의 정본·교체 절차: `.claude/docs/secrets-map.md`
      - name: Build
        run: npm run build
        env:
          VITE_GITHUB_CLIENT_ID: Iv23li4rMCxm07zyBBmN

      # 빌드 산출물 단언 — env 가 빠지면 빌드는 성공하고 로그인만 조용히 죽는다(10-26~10-28 실제로 그랬다).
      - name: Assert OAuth client id in bundle
        run: |
          if grep -rq 'client_id=undefined' dist; then
            echo "::error::번들에 client_id=undefined — VITE_GITHUB_CLIENT_ID 가 빌드에 안 들어갔다"; exit 1
          fi
          grep -rq 'Iv23li4rMCxm07zyBBmN' dist || { echo "::error::번들에 GitHub client id 가 없다"; exit 1; }

      # wranglerVersion 을 생략하면 npm ci 로 설치된 fe 의 wrangler(package.json 에 고정)를 그대로 쓴다.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: fe
          command: deploy
