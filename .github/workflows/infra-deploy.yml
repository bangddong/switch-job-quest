name: Infra Deploy

# OpenTofu plan-on-PR / apply-on-merge. 장기 액세스키 없이 GitHub OIDC로 역할 assume.
#   - PR 열림      → tofu plan (변경 미리보기, step summary에 출력)
#   - main 머지    → tofu apply (실제 반영)
# 역할 ARN·민감 변수는 커밋 파일에 두지 않고 GitHub Secret으로 주입한다.

on:
  pull_request:
    paths: ["infra/aws-eks/**"]
  push:
    branches: [main]
    paths: ["infra/aws-eks/**"]

concurrency:
  group: infra-deploy-${{ github.ref }}
  cancel-in-progress: false # apply 도중 취소는 state 꼬임 위험 → 끄기

permissions:
  id-token: write # OIDC 토큰 발급(역할 assume)에 필수
  contents: read

jobs:
  tofu:
    name: Infra Deploy / ${{ matrix.layer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 레이어는 독립적 — 하나 실패해도 나머지는 진행
      matrix:
        # ⚠️ 여기 나열된 레이어는 main 머지 시 CI가 자동으로 tofu apply 한다.
        #    2-cluster(EKS 컨트롤플레인 $0.10/hr)는 로컬 apply/destroy 전용 —
        #    절대 추가하지 말 것. 추가하면 머지 순간 CI가 컨트롤플레인을 띄우고,
        #    아무도 destroy 안 하면 상시 과금이 샌다.
        #    → Infra CI의 guard 잡(guard-local-layers)이 이 실수를 기계적으로 차단한다.
        #    gitops 등 상주형($0 유지) 레이어만 생기면 추가.
        layer: [0-bootstrap, 1-network]
    defaults:
      run:
        working-directory: infra/aws-eks/${{ matrix.layer }}
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.5

      # OIDC로 임시 자격증명 획득 — 신뢰정책이 이 레포 main/PR로 제한
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 🔴 계정 ID 마스킹 — **이 레포는 퍼블릭이고 Actions 로그·요약도 퍼블릭이다.**
      #
      # 왜 필요한가 (2026-09-15 실측으로 확인, 그전엔 새는 줄 몰랐다):
      #   ACM 인증서를 만들자 apply 로그에 이 줄이 찍혔다 —
      #     aws_acm_certificate.learning: Creation complete after 7s [id=arn:aws:acm:...:<계정ID>:...]
      #   **`output` 에 `sensitive = true` 를 걸어도 막히지 않는다.** sensitive 는 `Outputs:`
      #   블록만 가리는데, 저 줄은 출력이 아니라 **provider 가 찍는 리소스 id** 다.
      #   ARN 을 갖는 리소스는 전부 같은 경로로 샌다.
      #
      # `::add-mask::` 는 그 시점 이후의 **로그**에서 값을 `***` 로 바꾼다.
      # ⚠️ **Step Summary 는 마스킹되지 않는다** — 아래 sed 로 따로 지운다.
      - name: 계정 ID 마스킹
        shell: bash
        run: |
          ACCT="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$ACCT"
          # 🔴 **여기서 크게 실패해야 한다.** 빈 값이면 아래 `sed`/치환이 아무것도 안 바꾸고
          #    **조용히 통과**한다(fail-open) — 계정 ID 가 그대로 로그에 찍힌다.
          #    이 레포가 반복해서 데인 형태다: *부재가 성공과 똑같이 생긴 실패*.
          #    (로컬 반증으로 확인: AWS_ACCOUNT_ID="" 이면 치환 0건, 종료코드 0)
          if [[ ! "$ACCT" =~ ^[0-9]{12}$ ]]; then
            echo "::error::계정 ID 조회 실패 — 마스킹 없이 진행할 수 없다 (길이/형식 불일치)"
            exit 1
          fi
          echo "AWS_ACCOUNT_ID=$ACCT" >> "$GITHUB_ENV"

      - name: tofu init
        run: tofu init -input=false

      # 🔴 파이프를 쓰는 스텝에는 **`set -euo pipefail` 을 인라인으로 박는다.**
      #    파이프의 마지막 명령(`tee`/`sed`) 종료코드만 보면 **plan 이 실패해도 초록**이 된다.
      #    ⚠️ 처음엔 *"기본 셸이 `bash -e` 라 pipefail 이 없고 `shell: bash` 가 켜준다"* 는
      #       근거를 달았는데, 그건 **로컬 bash 플래그 비교로 증명되지 않는다**(QA F-3) —
      #       GH 러너가 셸 미지정 시 실제로 어떤 플래그로 부르는지는 별개 사실이다.
      #       그래서 **런타임 기본값에 기대지 않고 스크립트가 직접 켠다.**
      #       (이 레포에 이미 같은 관용구가 있다 — `ecr-push.yml` 의 `set -euo pipefail`)
      #
      # 🔴 `sed -u` 의 `-u` 를 빼지 마라 — **없으면 로그가 실시간으로 안 흐른다.**
      #    sed 는 파이프 출력일 때 full buffering 이라 apply 가 끝나야(또는 버퍼가 차야)
      #    한꺼번에 쏟아진다. 과금 중 진행 상황을 못 보는 것은 실제 비용이다.
      #    실측(3줄·1초 간격): `sed` → 전부 28.3s 도착 / `sed -u` → 28.3·29.3·30.3s (QA F-1)
      - name: tofu plan (PR)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          TF_VAR_budget_notification_email: ${{ secrets.BUDGET_EMAIL }}
        run: |
          set -euo pipefail
          echo '### tofu plan — `${{ matrix.layer }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # ⚪ **미확인 전제**: Step Summary 는 `::add-mask::` 대상이 아니라고 보고 여기서 직접 지운다.
          #    GH 런타임 동작이라 레포에서 검증할 수 없었다(QA F-2 도 확인 실패).
          #    틀렸더라도 방향이 안전한 쪽(과잉 마스킹)이라 그대로 둔다.
          tofu plan -input=false -no-color 2>&1 \
            | sed -u "s/${AWS_ACCOUNT_ID:-__unset__}/<account>/g" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: tofu apply (merge to main)
        if: github.event_name == 'push'
        shell: bash
        env:
          TF_VAR_budget_notification_email: ${{ secrets.BUDGET_EMAIL }}
        # sed 는 보조 방어다 — 로그는 `::add-mask::` 가 이미 가린다.
        # 둘 다 두는 이유: 마스킹 스텝이 실패하면 apply 가 맨몸으로 찍힌다.
        run: |
          set -euo pipefail
          tofu apply -auto-approve -input=false -no-color 2>&1 \
            | sed -u "s/${AWS_ACCOUNT_ID:-__unset__}/<account>/g"
