name: Prod Smoke (daily-question)

# Stage A(#387)의 **prod 회귀 가드**. TASK-10 자동화가 아니라 상시 감시다.
#
# ── 무엇을 지키나 ──
# #387 이전, `GET /api/v1/daily-question` 은 매일 00:00~09:00 KST(하루 9시간) 404였다.
# `ensureTodayQuestion()`의 유일한 호출자가 09:00 cron이었기 때문. 지금은 읽기 시
# 뱅크에서 lazy 생성한다(AI 미호출). 그 성질이 깨지면 여기서 잡는다.
#
# ── 왜 09:00 이전이어야 하나 ──
# 09:00 이후엔 `DailyMailScheduler`가 이미 오늘 행을 만들어놔서 **lazy 경로를 안 탄다.**
# 그 시각에 200이 나와도 이번 변경 덕분인지 알 수 없다. 그래서 창이 09:00 이전뿐이다.
# 사람이 그 시간에 붙어 있기를 기대할 수 없어서(실제로 3일 연속 놓쳤다) 기계에 맡긴다.
#
# ⚠️ GitHub Actions cron은 **UTC**다. 20:23 UTC = 05:23 KST — 09:00까지 약 3.5시간 여유.
#    Actions 스케줄은 수 분~수십 분 지연될 수 있어 넉넉히 잡았다.

on:
  schedule:
    - cron: '23 20 * * *'   # 05:23 KST (= 20:23 UTC 전일)
  workflow_dispatch:         # 수동 실행용

permissions:
  contents: read

jobs:
  smoke:
    name: Prod Smoke / 09:00 이전 200 확인
    runs-on: ubuntu-latest
    steps:
      - name: 시각 확인 (09:00 KST 이전이어야 의미가 있다)
        run: |
          echo "UTC : $(date -u '+%Y-%m-%d %H:%M')"
          echo "KST : $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          H=$(TZ=Asia/Seoul date '+%-H')
          if [ "$H" -ge 9 ]; then
            echo "::warning::09:00 KST 이후에 실행됐다 — cron이 지연됐을 수 있다."
            echo "이 경우 200이 나와도 lazy 생성 경로를 탄 증거가 아니다(cron이 이미 행을 만듦)."
          fi

      - name: GET /api/v1/daily-question
        run: |
          CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
                 --max-time 30 --retry 2 --retry-delay 5 \
                 https://quest.dhbang.co.kr/api/v1/daily-question) || CODE="curl-failed"
          echo "HTTP $CODE"
          echo "--- body (앞 400자) ---"
          head -c 400 /tmp/resp.json || true
          echo

          if [ "$CODE" != "200" ]; then
            echo "::error::기대 200, 실제 $CODE — 09:00 이전 lazy 생성이 깨졌을 수 있다."
            echo "확인 순서:"
            echo "  1. 배포 상태 (fly status)"
            echo "  2. 404면 질문 뱅크 소진 가능성 — 뱅크 26개 · RECENT_QUESTION_WINDOW_DAYS=20."
            echo "     소진이면 404가 정상 동작이다(AI 폴백은 09:00 cron 전용)."
            echo "  3. 그 외면 DailyQuestionService/DailyQuestionContentService 회귀 의심"
            exit 1
          fi

      - name: 응답에 question 필드가 실제로 있는지
        run: |
          # 200이어도 body가 비면 의미 없다 — "통과했다고 믿게 만드는 검사"를 만들지 않는다.
          python3 - <<'PY'
          import json,sys
          d=json.load(open('/tmp/resp.json'))
          q=(d.get('data') or {}).get('question')
          if not q or not q.strip():
              print(f"::error::200이지만 question이 비어 있다: {d}")
              sys.exit(1)
          print(f"✅ question 길이 {len(q)}자 — 앞 80자: {q[:80]}")
          PY
