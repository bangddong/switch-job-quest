name: Design Integrity

# 설계 기록이 코드와 어긋나는 것을 기계로 잡는다.
#
# 배경(07-29 전수 점검): 결정은 CONTEXT.md에, 재판정은 일지에 따로 살아서
# "이미 뒤집힌 결정"을 유효한 것으로 읽는 사고가 실제로 발생했다.
# 사람 기억에 맡기지 않고 PR마다 검사한다.
#
# 경로 필터를 두지 않는다 — 코드 파일 삭제가 문서를 깨뜨리는 경우를 잡아야 하므로
# "문서를 안 건드린 PR"이 오히려 위험하다.

on:
  pull_request:

concurrency:
  group: design-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Design Integrity / 결정-코드 정합성
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 설계 무결성 검사
        run: bash .claude/scripts/check-design-integrity.sh

      # 2026-08-11 추가. 훅이 "설정돼 있는가"가 아니라 "실행 가능한가"를 본다.
      # 계기: .claude/scripts/의 .sh 19개 중 12개가 mode 644라 훅으로 호출되면 exit 126으로
      #       죽었고, 훅 프로토콜상 차단은 exit 2뿐이라 **막지 못하고 조용히 통과**시켰다.
      #       `.claude/logs/`가 존재하지 않는 것이 증거였다(log-event.sh가 무조건 mkdir하는데도).
      #       설계 무결성 검사와 나란히 두는 이유: 둘 다 "문서/설정이 실물과 맞는가"를 본다.
      #       ⚠️ checkout이 파일 모드를 보존하므로 CI에서도 644가 그대로 재현된다.
      - name: 훅 배선 검사 (실행 권한·경로 이식성)
        run: bash .claude/scripts/check-hook-wiring.sh

      # 2026-08-15 추가 (원장 L-11 해소). 배선 검사가 "실행 가능한가"를 본다면
      # 이것은 **"올바르게 판정하는가"** 를 본다 — 세 번째 지층이다.
      #   ① 검사가 주장보다 헐겁다 (08-11)  → verify 마커 조임
      #   ② 검사가 실행되지 않는다 (08-11)  → check-hook-wiring.sh
      #   ③ 검사가 실행돼도 틀린다  (08-15) → 여기
      # ⚠️ 차단 케이스와 **오탐 케이스를 함께** 돌린다. 차단만 보면 "전부 막으면 만점"이 되어
      #    가드가 조이는 방향으로만 회귀하고, 그러면 사람이 우회하기 시작한다(실제로 발생, L-21).
      - name: 가드 회귀 테스트 (차단 + 오탐 양방향)
        run: bash .claude/scripts/test-guards.sh
