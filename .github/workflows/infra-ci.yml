name: Infra CI

# IaC 보안 2층 게이트 — 매 PR에서 자동 강제 (사람 손 점검을 기계 강제로 대체).
#   1) gitleaks : 코드/히스토리 시크릿 스캔 (AWS 키·토큰·비밀번호 등)
#   2) tfsec    : OpenTofu/Terraform 설정 취약점 스캔 (infra/aws-eks)
# tfsec는 코드의 #tfsec:ignore:<id> 주석(근거 명시된 판단)을 존중한다.

on:
  pull_request:

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Infra CI / gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 전체 히스토리 스캔 (과거 커밋에 섞인 시크릿까지)

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tfsec:
    name: Infra CI / tfsec (IaC scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/aws-eks
          # 발견 시 종료코드 비0 → PR 체크 실패 (근거 없는 취약점은 머지 차단)

  guard-local-layers:
    name: Infra CI / guard (로컬 전용 레이어 apply 차단)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 로컬 전용 레이어가 apply 매트릭스에 없는지 검증
        # 2-cluster(EKS 컨트롤플레인 상시 과금)는 로컬 apply/destroy 전용.
        # infra-deploy 매트릭스에 들어가면 main 머지 시 CI가 자동 apply → 과금 누수.
        # 그 실수를 담은 PR을 여기서 기계적으로 실패시켜 머지를 차단한다.
        # (yq는 GitHub ubuntu-latest 러너에 기본 탑재)
        run: |
          LAYERS=$(yq '.jobs.tofu.strategy.matrix.layer[]' .github/workflows/infra-deploy.yml)
          echo "infra-deploy apply 매트릭스: $(echo "$LAYERS" | tr '\n' ' ')"
          for local_layer in 2-cluster; do
            if echo "$LAYERS" | grep -qx "$local_layer"; then
              echo "::error file=.github/workflows/infra-deploy.yml::'$local_layer'는 로컬 apply/destroy 전용 레이어입니다. apply 매트릭스에서 제거하세요 — main 머지 시 CI가 자동 apply하여 상시 과금됩니다."
              exit 1
            fi
          done
          echo "OK: 로컬 전용 레이어가 apply 매트릭스에 없음"

      - name: 2-cluster 를 켜는 워크플로는 eks-window.yml 하나, 수동으로만 (N-3 재정의)
        # 📌D-016 8-B — 위 검사의 원래 뜻은 *"머지가 컨트롤플레인을 띄우지 않는다"* 였다. 그런데 위 검사는 infra-deploy 의
        # 매트릭스만 본다 → **새 워크플로가 2-cluster 를 apply 해도 초록**(N-3, 조용한 보호 소실). D-016 은 CI 가 2-cluster 를
        # 켜는 것을 **의도적으로** 허용하므로, 뜻을 이렇게 다시 적는다:
        #   ① 2-cluster 를 apply·destroy 하는 워크플로는 eks-window.yml 하나다
        #   ② eks-window.yml 의 트리거는 workflow_dispatch·schedule 뿐이다(push·pull_request 면 머지·PR 이 켠다)
        #   ③ apply 가 있는 on 잡은 workflow_dispatch + action == 'on' 일 때만 돈다(schedule 은 끄기만 — Q-3 "켜기는 수동만")
        # ⚠️ 한계: 워크플로가 **스크립트 안에서** tofu apply 를 부르면 못 본다. 그래서 prod-window 스크립트는 tofu apply/destroy 를
        #    부르지 않는다(on.sh 는 `tofu output` 만) — 그 규칙을 아래 ④ 가 잡는다.
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0
          nc() { grep -v '^[[:space:]]*#' "$1" | sed 's/[[:space:]]#.*//'; }   # 주석 제거(주석의 "2-cluster" 오탐 방지)
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = eks-window.yml ] && continue
            # 이 파일 자신은 검사 문구에 두 단어가 다 들어 있어 자기 자신에 걸린다(실측). 대신 **AWS 자격증명을 못 받는지**를 본다(QA F-4)
            if [ "$(basename "$f")" = infra-ci.yml ]; then
              # 앵커 필수 — 이 검사의 문구 자체가 자기 자신에 걸렸다(실측 두 번째)
              if grep -qE '^[[:space:]]*id-token:[[:space:]]*write|uses:[[:space:]]+aws-actions/configure-aws-credentials' "$f"; then
                echo "::error file=$f::infra-ci 는 PR 트리거다 — AWS 자격증명을 받으면 위 검사의 자기 제외가 구멍이 된다"; FAIL=1
              fi
              continue
            fi
            if nc "$f" | grep -q '2-cluster' && nc "$f" | grep -qE 'tofu[^#]*[[:space:]](apply|destroy)'; then
              echo "::error file=$f::2-cluster 를 apply·destroy 하는 워크플로는 eks-window.yml 하나여야 한다(📌D-016 8-B)"; FAIL=1
            fi
          done
          W=.github/workflows/eks-window.yml
          TRIG=$(yq '.on | keys | .[]' "$W" | sort | tr '\n' ' ')
          [ "$TRIG" = "schedule workflow_dispatch " ] || { echo "::error file=$W::트리거는 schedule·workflow_dispatch 만 — 실제: $TRIG"; FAIL=1; }
          # 정확히 일치 — 부분 문자열이면 `… || true` 를 덧붙여도 통과한다(QA F-4). 바꾸려면 이 줄도 함께 바꾼다
          IF=$(yq '.jobs.on.if' "$W")
          [ "$IF" = "github.event_name == 'workflow_dispatch' && inputs.action == 'on'" ] \
            || { echo "::error file=$W::on 잡(apply)은 workflow_dispatch + action == 'on' 일 때만 — 실제 if: $IF"; FAIL=1; }
          # 명령 형태로 본다 — 단계 이름("tofu apply (💰 …)")에도 걸려 apply 가 사라져도 통과하던 것을 반증으로 확인했다
          nc "$W" | grep -q 'tofu apply -auto-approve' || { echo "::error file=$W::apply 명령이 사라졌다 — 이 검사를 함께 고쳐라"; FAIL=1; }
          # ④ prod-window 스크립트는 tofu apply/destroy 를 부르지 않는다(위 ① 의 사각지대를 닫는다)
          for s in infra/aws-eks/scripts/prod-window/*.sh; do
            if nc "$s" | grep -qE 'tofu[^#]*[[:space:]](apply|destroy)'; then
              echo "::error file=$s::prod-window 스크립트에서 tofu apply/destroy 금지 — 워크플로 단계로(검사 ① 이 보게)"; FAIL=1
            fi
          done
          [ "$FAIL" = 0 ] && echo "OK: 2-cluster apply 는 eks-window.yml 의 수동 on 잡뿐"
          exit "$FAIL"

      - name: 영속 EBS에 CSI 삭제 권한 태그가 없는지 검증
        # 6개월 영속 볼륨의 삭제 방지는 "코드에 **없는** 것"으로 구현돼 있다 —
        # AmazonEBSCSIDriverPolicy가 DeleteVolume을 태그 조건으로만 허용하므로,
        # 그 태그를 안 붙이면 CSI 컨트롤러가 볼륨을 지울 권한 자체를 갖지 못한다.
        # 보호가 "부재"라 눈에 안 보이고, 누가 태그를 추가하면 주석은 그대로인데
        # 보호만 사라진다. 사람이 지킬 일이 아니라 여기서 막는다.
        run: bash .claude/scripts/assert-no-csi-delete-tags.sh

      - name: 검사기 자가 테스트 (반증)
        # 아무것도 매칭 못 하는 검사기도 "0건 통과"를 낸다.
        # 태그가 실제로 있을 때 잡는지, 주석을 오탐하지 않는지를 매번 확인한다.
        run: bash .claude/scripts/assert-no-csi-delete-tags.sh --self-test
