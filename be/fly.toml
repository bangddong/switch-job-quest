app = 'devquest-api'
primary_region = 'nrt'

# OOM 완화: RSS가 512MB 한계 근접 시 스왑으로 흡수 (2026-07-07, OOM 조사 결과)
# 근본 원인: 부팅 직후 가용 마진 ~44MB + 시간당 ~3MB RSS 증가 → 장시간 가동 시 OOM kill
swap_size_mb = 256


[build]

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  CORS_ALLOWED_ORIGINS = "https://quest.dhbang.co.kr"
  # JVM 기본 zone을 KST로 만든다(#210). **이 값만으로 정상 동작한다** — 이미지 실측:
  # TZ 미설정 → GMT / TZ=Asia/Seoul → Asia/Seoul (eclipse-temurin alpine엔 tzdata 포함).
  # be/Dockerfile의 `-Duser.timezone=Asia/Seoul`은 배포 설정이 유실돼도 버티게 하는 이중 안전장치일 뿐,
  # 이 줄을 대체하려고 넣은 게 아니다. 둘 다 유지한다. (#336의 "TZ는 무효" 서술은 #337에서 정정됨)
  TZ = "Asia/Seoul"

# 민감 정보는 fly secrets set 으로 주입:
#   fly secrets set ANTHROPIC_API_KEY=sk-...

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  grace_period = "180s"
  interval = "15s"
  method = "get"
  path = "/health"
  timeout = "10s"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
