app = 'devquest-api'
primary_region = 'nrt'

# OOM 완화: RSS가 512MB 한계 근접 시 스왑으로 흡수 (2026-07-07, OOM 조사 결과)
# 근본 원인: 부팅 직후 가용 마진 ~44MB + 시간당 ~3MB RSS 증가 → 장시간 가동 시 OOM kill
swap_size_mb = 256


[build]

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  CORS_ALLOWED_ORIGINS = "https://quest.dhbang.co.kr"
  # 참고: 이 값만으로는 Alpine 베이스에서 실효가 없다 — `tzdata` 패키지가 없어 TZ가 조용히
  # 무시되고 UTC로 폴백한다(fix/timezone-consistency에서 확인). 실제 zone 고정은
  # be/Dockerfile ENTRYPOINT의 `-Duser.timezone=Asia/Seoul`(JDK 번들 tzdb)이 담당한다.
  # 줄은 의도 문서화 + 향후 tzdata를 넣거나 베이스 이미지를 바꾸면 유효해지므로 남겨둔다.
  TZ = "Asia/Seoul"

# 민감 정보는 fly secrets set 으로 주입:
#   fly secrets set ANTHROPIC_API_KEY=sk-...

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  grace_period = "180s"
  interval = "15s"
  method = "get"
  path = "/health"
  timeout = "10s"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
