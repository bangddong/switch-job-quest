# daily-api 기본(local) 설정. `classpath:db-core.yml`을 import하지 않는다 — daily-api는 자신의
# `storage.datasource.core.*`를 직접 정의한다(함정 ① — db-core.yml의 ddl-auto: create-drop을
# prod에서 오버라이드할 경로 자체를 없애기 위함, application-prod.yml 참고).
spring:
  application:
    name: devquest-daily-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      # ⑥ B8-18 — 공통 모니터링 설정(공통 태그·히스토그램·오토컨피그 OTLP 차단). logging.yml·db-core.yml 은 가져오지 않는다.
      # 🔴 import 한 파일의 값은 이 파일 값을 이긴다 - 앱별 값(service-name·exposure)은 monitoring.yml 이 리터럴로 갖지 않는다.
      - classpath:monitoring.yml
  h2:
    console:
      enabled: false
  jpa:
    # B7-21 ⓐ — OSIV 를 앱 전체에서 끈다(모든 프로필). core-api application.yml 과 같은 결정이다.
    # daily-api 의 채점 경로는 요청 스레드에서 JPA 를 쓰지 않아 지금도 active=0 이지만(D-016 M3), 읽기 경로(오늘의 질문 조회)는
    # JPA 를 쓰므로 OSIV 가 켜져 있으면 응답 직렬화까지 커넥션을 쥔다. 풀이 3개뿐이라 슬롯 1개가 크다.
    # 전제(엔티티 연관관계 0개·엔티티 비노출)는 core-api 의 OsivOffPremiseGuardTest 가 지킨다.
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  # core-api(8080) / ai-api(8081)와 겹치지 않도록 8082 사용 (함정 ⑧).
  # ⚠️ be/Dockerfile:35의 `EXPOSE 8080`은 서비스별로 조정되지 않는다 — Dockerfile은 이번
  # 범위에서 수정하지 않는다(Stage C에서 매니페스트/Dockerfile 작업 시 함께 처리).
  port: 8082
  # B7-19-2 ⓐ / D-016 계획 9번 — 전략을 명시 고정한다. 미설정이면 Spring Boot 가 Kubernetes 일 때만 암묵 NATIVE,
  # Fly 는 NONE 이라 같은 코드가 플랫폼별로 isSecure·remoteAddr 를 다르게 봤다. native = Tomcat RemoteIpValve:
  # 신뢰 프록시(내부 대역·루프백)가 보낸 X-Forwarded-For/Proto 만 해석한다.
  # `framework` 는 기각 — ForwardedHeaderFilter 는 신뢰 프록시 판정 없이 XFF 맨 왼쪽을 remoteAddr 로 써서
  # 클라이언트가 보낸 `X-Forwarded-For: 127.0.0.1` 로 loopback 판정을 위조할 수 있다(core-api SecurityConfig 의 actuator 절과 동일 설정 유지).
  forward-headers-strategy: native

# C-1 — core-api application.yml:39-49와 동일 계약. `/health`(liveness)는 상수만 반환하므로
# readiness에는 절대 쓰지 않는다 — DB가 죽어도 readiness가 UP으로 보이면 Service가 죽은 파드로
# 계속 트래픽을 흘려보낸다. 그래서 readiness 그룹을 명시적으로 정의해 실제 의존성(db)과 항상 UP인
# ping만 보게 한정한다(daily-api엔 core-api의 mail 같은 AND 과결합 위험 지표가 없다).
# 프로필과 무관한 공통 설정에 둔다 — 로컬/테스트에서도 같은 계약을 검증하기 위함(core-api와 동일 이유).
management:
  endpoints:
    web:
      exposure:
        # /actuator/prometheus 는 노출하지 않는다(core-api 와 다르다). daily-api 는 스크레이프 경로가 없고 Grafana 로 push 만 한다.
        include: health
  # Prometheus 레지스트리 자체를 끈다 - support:monitoring 이 micrometer-registry-prometheus 를 runtime 으로 끌어오지만
  # 읽는 곳이 없어 메모리만 쓴다. (오토컨피그 OTLP 는 monitoring.yml 이 공통으로 끈다.)
  prometheus:
    metrics:
      export:
        enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: db,ping

logging:
  level:
    com.devquest: DEBUG

storage:
  datasource:
    core:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:dailyapi;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      password:
      maximum-pool-size: 5

devquest:
  observability:
    # Grafana job 라벨(OTLP service.name)·Loki app 라벨·메트릭 공통 태그 application 의 값. core-api(devquest-api)와
    # job 을 분리한다. support:monitoring / support:logging 이 이 키를 읽는다.
    service-name: devquest-daily-api
  # B7-19 2단계 — Cloudflare Worker 와 원본이 공유하는 비밀. Worker 가 X-DevQuest-Edge-Auth 로 보내고,
  # 일치할 때만 X-DevQuest-Client-IP 를 익명 레이트 리밋의 클라이언트 IP 로 쓴다(ClientIpResolver).
  # 빈 기본값 = 신뢰 헤더 미사용(기존 Fly-Client-IP/XFF/remoteAddr 판정). 실제 값은 시크릿 저장소에서만 주입한다.
  edge:
    auth-secret: ${EDGE_AUTH_SECRET:}
  # DailyQuestionContentService(daily-core)의 `@Value("${devquest.daily-question.tech-stack}")`가
  # 기본값 없이 요구하는 키(함정 ⑥). core-api의 application.yml:93-94와 값이 반드시 동일해야
  # 한다 — 값이 갈라지면 두 앱이 만드는 "AI 폴백 질문"의 기술 스택 범위가 조용히 달라진다.
  daily-question:
    tech-stack: "Java,Spring Boot,JPA,데이터베이스(SQL/인덱스/트랜잭션),네트워크(HTTP/TCP/DNS),운영체제(프로세스/스레드/메모리),자료구조/알고리즘,시스템 설계,Redis/캐시,Docker/쿠버네티스,CI-CD/Git"
  ai:
    http:
      # ai-api 베이스 URL. 시크릿 아님 — 평문 기본값 허용(로컬 개발 기준 ai-api 포트 8081).
      base-url: ${AI_API_BASE_URL:http://localhost:8081}
      # DailyAiConfig 참고: 내부망 연결이라 3초 안에 안 붙으면 네트워크/기동 문제로 간주해 즉시 실패.
      connect-timeout-ms: ${AI_API_CONNECT_TIMEOUT_MS:3000}
      # DailyAiConfig 참고: ai-api 내부 AiCallExecutor(max-retry=3)가 같은 HTTP 응답 안에서 순차
      # 재시도한다(1회 상한 가정 30초 × 3회 = 90초) + 안전 마진 60초 = 150초. core-api의
      # AiHttpClientConfig와 동일한 계산 근거.
      read-timeout-ms: ${AI_API_READ_TIMEOUT_MS:150000}
  rate-limit:
    # core-api/application.yml의 devquest.rate-limit.daily-explain / daily-evaluate와 동일 값.
    # global-capacity: 익명 경로 전체 일일 상한 — IP 개인 버킷(capacity) 통과분만 차감한다.
    daily-explain:
      capacity: 5
      global-capacity: 100
      refill-days: 1 # 메모리 대체 버킷 전용 — DB 카운터는 KST 하루 고정이라 이 값을 읽지 않는다
    daily-evaluate:
      capacity: 1
      global-capacity: 50
      refill-days: 1 # 메모리 대체 버킷 전용 — DB 카운터는 KST 하루 고정이라 이 값을 읽지 않는다
