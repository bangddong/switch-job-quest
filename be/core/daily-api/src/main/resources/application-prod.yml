# daily-api prod 프로필. 함정 ① 대응 — `ddl-auto`를 **명시적으로** validate로 고정한다.
# Boot는 비임베디드 DB에서 ddl-auto 기본값이 none이지만, 기본값에 기대지 않고 명시한다
# (기본값 조용한 변경·조회 시점 착각 등에 대비 — DailyApiProdDdlAutoTest가 이 값을 회귀 고정한다).
logging:
  level:
    com.devquest: INFO

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

storage:
  datasource:
    core:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      maximum-pool-size: 10
      minimum-idle: 0
      connection-test-query: SELECT 1

server:
  port: 8082

# ⚠️ 의도적으로 `devquest.flyway.migrate-on-startup`을 켜지 않는다(기본값 false 유지).
# db-core의 FlywayConfig KDoc 참고 — daily-api가 db-core만 의존한 상태로 repair()+migrate()를
# 돌리면, daily-api 클래스패스에 없는 core-api 소유 마이그레이션 버전(V1~V6, V8, V9)이
# flyway_schema_history에서 DELETED로 마킹되어 core-api가 다음 기동 시 그 버전을 재실행하며
# 영구 부팅 불가에 빠진다(2026-07-01 V8 사고 재발 경로). 마이그레이션 실행 주체는 core-api
# 하나로 유지한다.

# ⚠️ 함정 ⑦ 기록: 이 프로필은 db-core에 정의된 **모든** JPA 엔티티(daily-api가 실제로 쓰는
# DailyQuestionContentEntity·TechQuestionBankEntity 외 나머지 13개 포함)를 `@EntityScan`으로
# 함께 로드한다. `ddl-auto: validate`는 로드된 모든 엔티티의 스키마를 기동 시 검증하므로,
# daily-api는 core-api 소유 테이블(예: users, resume 등)의 스키마 변경에도 함께 묶인다 —
# core-api가 아닌 daily-api가 먼저 그 스키마 불일치로 기동 실패할 수 있다는 뜻이다.
