# daily-api prod 프로필. 함정 ① 대응 — `ddl-auto`를 **명시적으로** validate로 고정한다.
# Boot는 비임베디드 DB에서 ddl-auto 기본값이 none이지만, 기본값에 기대지 않고 명시한다
# (기본값 조용한 변경·조회 시점 착각 등에 대비 — DailyApiProdDdlAutoTest가 이 값을 회귀 고정한다).
logging:
  level:
    com.devquest: INFO

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

storage:
  datasource:
    core:
      driver-class-name: org.postgresql.Driver
      # B7-21 ⓐ — core-api application-prod.yml 과 같은 값·같은 이유다(D-016 M4 실측: connectTimeout 은 TCP 수립, socketTimeout 은 쿼리 중 동결,
      # connection-timeout 은 풀 대기·핸드셰이크 침묵을 끊는다). daily-api 는 마이그레이션을 돌리지 않아 socketTimeout 30초의 부작용이 없다.
      jdbc-url: jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require&connectTimeout=5&socketTimeout=30
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      # 10 → 3 (U-6). EKS 몫 커넥션 예산 25 안에 들이기 위해서다: core-api 10 + daily-api 3 × HPA 최대 4 = 22 ≤ 25.
      # 이전 10 × 4 = 40 이면 core-api 10 과 합쳐 50 으로 예산(와 EC2 Postgres max_connections 50)을 혼자 넘는다.
      # daily-api 는 오늘의 질문 읽기·소량 쓰기와 레이트 리밋 카운터만 쓴다. 카운터 쿼리는 문장마다 커넥션을 빌렸다
      # 즉시 반납하므로(OSIV OFF 라 요청 내내 쥐지 않는다) 파드당 3 이면 충분하다.
      # connection-timeout·validation-timeout·pgjdbc socketTimeout 은 B7-21 ⓐ 에서 core-api 와 같이 맞췄다(jdbc-url 참고).
      maximum-pool-size: 3
      minimum-idle: 0
      connection-test-query: SELECT 1
      # 풀 대기 상한 30초(Hikari 기본) → 5초. 풀이 3개뿐이라 가득 찰 때 요청이 30초 매달리는 비용이 core-api 보다 크다.
      connection-timeout: 5000
      # 대여 직전 `SELECT 1` 검증 상한 5초 → 2초. connection-timeout 보다 짧게 둔다(대기 상한 안에서 검증이 끝나야 한다).
      validation-timeout: 2000

server:
  port: 8082

# ⑥ B8-18 — Grafana Cloud 지표 송출(OtlpMetricsConfig). core-api application-prod.yml 과 같은 키 구조·같은 instance-id 리터럴이다.
# instance-id 는 Grafana 스택 ID(Basic 인증 username)이고 시크릿이 아니다. 🔴 환경변수로 바꾸지 않는다 - 주입이 빠지면
# GrafanaOtlpCredentialsCondition 이 false 가 돼 송출이 조용히 멈춘다. 인증 키는 환경변수 GRAFANA_API_KEY 한 곳에서만 온다.
# Loki 로그는 GRAFANA_LOKI_URL / GRAFANA_LOKI_INSTANCE_ID / GRAFANA_API_KEY 환경변수를 logback-spring.xml 이 직접 읽는다.
# 앱 구분은 devquest.observability.service-name(application.yml), 플랫폼 구분은 환경변수 DEVQUEST_PLATFORM(fly|eks)이다.
# 오토컨피그 OTLP 차단(management.otlp.metrics.export.enabled=false)은 monitoring.yml 이 모든 프로필에 공통으로 건다.
grafana:
  otlp:
    enabled: true
    instance-id: "1680166"

# ⚠️ 의도적으로 `devquest.flyway.migrate-on-startup`을 켜지 않는다(기본값 false 유지).
# db-core의 FlywayConfig KDoc 참고 — daily-api는 db-core만 의존해 클래스패스에 core-api 소유 마이그레이션
# 버전(V1~V6, V8, V9)이 없다. 클래스패스가 다른 앱이 마이그레이션(특히 repair)을 돌리면 그 버전들이
# flyway_schema_history에서 DELETED로 마킹되어 core-api가 재실행하며 영구 부팅 불가에 빠진다(2026-07-01 V8 사고).
# 마이그레이션 실행 주체는 core-api 이미지 하나다 — Fly는 release_command("migrate"), EKS는 당분간 core-api 기동 시.
# (repair()는 자동 경로에서 제거됐다. 수동 모드 `java -jar app.jar repair`는 core-api 이미지에만 있다.)

# ⚠️ 함정 ⑦ 기록: 이 프로필은 db-core에 정의된 **모든** JPA 엔티티(daily-api가 실제로 쓰는
# DailyQuestionContentEntity·TechQuestionBankEntity 외 나머지 13개 포함)를 `@EntityScan`으로
# 함께 로드한다. `ddl-auto: validate`는 로드된 모든 엔티티의 스키마를 기동 시 검증하므로,
# daily-api는 core-api 소유 테이블(예: users, resume 등)의 스키마 변경에도 함께 묶인다 —
# core-api가 아닌 daily-api가 먼저 그 스키마 불일치로 기동 실패할 수 있다는 뜻이다.
