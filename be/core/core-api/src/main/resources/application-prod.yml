logging:
  level:
    com.devquest: INFO
    org.flywaydb: INFO

spring:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
grafana:
  otlp:
    enabled: true
    instance-id: "1680166"

# 오토컨피그 OtlpMeterRegistry 차단(management.otlp.metrics.export.enabled=false)은 monitoring.yml 이 모든 프로필에 공통으로 건다
# (⑥ B8-18 에서 daily-api 와 공유하려고 여기서 옮겼다). 수동 빈(OtlpMetricsConfig)만 Grafana 로 보낸다 - 둘이 동시에 기동하면 429.


devquest:
  flyway:
    # db-core의 FlywayConfig는 devquest.flyway.migrate-on-startup=true를 명시적으로 켠 앱에서만
    # 기동 시 migrate()를 실행한다(repair()는 없다 — FlywayConfig.kt 클래스 주석 참고).
    # 이 기본값(true)은 EKS가 쓴다 — EKS는 당분간 기동 시 마이그레이션을 유지한다(Job 분리는 후속 작업).
    # Fly는 배포 단계(be/fly.toml의 release_command = "migrate")에서 마이그레이션하고,
    # 앱 기동에서는 DEVQUEST_FLYWAY_MIGRATE_ON_STARTUP=false로 끈다. 이 기본값을 바꾸지 말 것.
    # 다른 앱(예: daily-api)이 db-core만 의존한 채 이 값을 켜지 않으면 마이그레이션은 돌지 않는다 — 게이트의 의도다.
    migrate-on-startup: true

storage:
  datasource:
    core:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      maximum-pool-size: 10
      minimum-idle: 0
      connection-test-query: SELECT 1
